# LOCAL OVERLAY — CONTRACT CHANGE #417 (Admin API 0.4.11) for #413, exactly the YAML of the issue.
# Merged over packages/contracts/openapi/admin-api.yaml by src/http/openapi.ts ONLY while the base document's
# version is below 0.4.11. Deleted in the PR that merges main with the contract landed. Never edited on its own:
# a change goes to #417 first.
info:
  version: 0.4.11
paths:
  /admin/stores/{storeId}:
    patch:
      responses:
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActivationBlocked' }
        '422': { $ref: '#/components/responses/InvalidSettings' }
  /admin/stores/{storeId}/activate:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    post:
      tags: [registry]
      operationId: activateStore
      summary: Move a draft or paused store to active once every prerequisite is present
      x-permission: { relation: owner, object: 'organization:hq' }
      responses:
        '200':
          description: OK (status active)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Store' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActivationBlocked' }
  /admin/onboarding/stores:
    post:
      tags: [registry]
      operationId: onboardStore
      summary: Onboard a brand in one transaction
      x-permission: { relation: owner, object: 'organization:hq' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreOnboardingInput' }
      responses:
        '201':
          description: Created — the publishable key is shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreOnboarded' }
        '200':
          description: Already onboarded with the same input — the same store, publishable_key null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreOnboarded' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidSettings' }
components:
  responses:
    ActivationBlocked:
      description: The store cannot become active — details.missing lists the absent prerequisites (or details.status is archived)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidSettings:
      description: A store.settings value has the wrong shape — details.settings maps each offending key to what was expected
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    LegalEntityInput:
      type: object
      required: [code, name, country, currency]
      properties:
        code: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        vat_number: { type: [string, 'null'] }
    StoreOnboardingInput:
      type: object
      required: [code, name, default_currency, default_locale, default_country, domain]
      properties:
        legal_entity_id: { type: string, format: uuid }
        legal_entity: { $ref: '#/components/schemas/LegalEntityInput' }
        code: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string }
        default_currency: { type: string, pattern: '^[A-Z]{3}$' }
        default_locale: { type: string }
        default_country: { type: string, pattern: '^[A-Z]{2}$' }
        timezone: { type: string, default: UTC }
        currencies: { type: array, items: { type: string } }
        locales: { type: array, items: { type: string } }
        domain:
          type: object
          required: [hostname]
          properties:
            hostname: { type: string }
        theme: { type: object, additionalProperties: true }
        settings: { type: object, additionalProperties: true }
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key: { type: string, description: Shown once }
    StoreOnboarded:
      type: object
      required: [store, legal_entity, domain, sales_channel, publishable_key]
      properties:
        store: { $ref: '#/components/schemas/Store' }
        legal_entity: { $ref: '#/components/schemas/LegalEntity' }
        domain: { $ref: '#/components/schemas/Domain' }
        sales_channel: { $ref: '#/components/schemas/SalesChannel' }
        publishable_key:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ApiKeyCreated'
