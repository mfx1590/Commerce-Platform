# PROPOSED (CONTRACT CHANGE, window 11, task 3.2 / #436): additions to packages/contracts/openapi/admin-api.yaml.
# They land WITH migration 0192 and with the routes that answer them (the #436 PR, after window 1's #456): a
# documented path that 404s is a contract defect. Nothing existing is removed or renamed.

paths:
  # ---------------------------------------------------------------- cycle counts (after the stock pool block)
  /admin/cycle-counts:
    get:
      tags: [inventory]
      operationId: listCycleCounts
      summary: Cycle counts of the shared pool, newest count first
      x-permission: { relation: operations, object: 'organization:hq' }
      parameters:
        - { name: warehouse_id, in: query, schema: { type: string, format: uuid } }
        - { name: stock_item_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [recorded, flagged, applied] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/CycleCount' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [inventory]
      operationId: createCycleCount
      summary: Record that a stock item was counted in a warehouse (changes no stock)
      description: >
        Writes the count down with status `recorded`; stock changes only through `reconcileCycleCount`.
        `counted_at` defaults to now and may not be in the future (422). Refused with 409 `superseded` when a
        count of the same stock item and warehouse with the same or a later `counted_at` has already been applied.
      x-permission: { relation: operations, object: 'organization:hq' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [warehouse_id, stock_item_id, counted_quantity]
              properties:
                warehouse_id: { type: string, format: uuid }
                stock_item_id: { type: string, format: uuid }
                counted_quantity: { type: integer, minimum: 0 }
                counted_at: { type: string, format: date-time }
                note: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CycleCount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A later count of this stock item and warehouse has already been applied (`superseded`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  code: superseded,
                  message: a later count of this stock item and warehouse has already been applied,
                  details: { applied_cycle_count_id: 72000000-0000-4000-8000-000000000002 },
                }
        '422':
          description: '`counted_at` is in the future'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/cycle-counts/{cycleCountId}/reconcile:
    parameters:
      - { name: cycleCountId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [inventory]
      operationId: reconcileCycleCount
      summary: Turn the count's discrepancy into one stock movement, or flag it for approval
      description: >
        Under the pool row's lock: on-hand as of `counted_at` = on-hand now minus the movements written since;
        delta = `counted_quantity` minus that. |delta| within `organization.settings.warehouse.count_tolerance`
        (non-negative integer, units; unset or malformed = 0): exactly one stock movement (reason `cycle_count`,
        no store, one `stock.moved` in the same transaction) and status `applied` — no movement when the delta
        is 0. Above the tolerance: nothing moves, status `flagged`, 200. A call with `approve: true` recomputes
        under the lock and applies whatever the delta is, recording the approver on the count and in the audit
        log. Idempotent by count: reconciling an `applied` count changes nothing and answers the same count.
      x-permission: { relation: operations, object: 'organization:hq' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                approve: { type: boolean, default: false }
      responses:
        '200':
          description: The count after reconciliation (`applied` or `flagged`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CycleCount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A later count of this stock item and warehouse has already been applied (`superseded`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  schemas:
    CycleCount:
      type: object
      required:
        [
          id,
          warehouse_id,
          stock_item_id,
          sku,
          counted_quantity,
          counted_by,
          counted_at,
          source,
          note,
          status,
          on_hand_as_of_count,
          delta,
          stock_movement_id,
          approved_by,
          approved_at,
          reconciled_at,
        ]
      properties:
        id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        stock_item_id: { type: string, format: uuid }
        sku: { type: string, description: The stock item's sku }
        counted_quantity: { type: integer, minimum: 0 }
        counted_by: { type: [string, 'null'], format: uuid, description: null for a system source }
        counted_at: { type: string, format: date-time }
        source: { type: string, enum: [manual, wms] }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [recorded, flagged, applied] }
        on_hand_as_of_count:
          { type: [integer, 'null'], description: null until the count is first reconciled }
        delta: { type: [integer, 'null'], description: counted_quantity minus on_hand_as_of_count }
        stock_movement_id:
          {
            type: [string, 'null'],
            format: uuid,
            description: set when a non-zero delta was applied,
          }
        approved_by: { type: [string, 'null'], format: uuid }
        approved_at: { type: [string, 'null'], format: date-time }
        reconciled_at: { type: [string, 'null'], format: date-time }
