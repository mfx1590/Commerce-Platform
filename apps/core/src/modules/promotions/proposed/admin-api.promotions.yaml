# PROPOSED (CONTRACT CHANGE, window 9, task 2.5): changes to packages/contracts/openapi/admin-api.yaml.
# Kept here verbatim until the main window applies it; the promotions router validates the PATCH body against
# the same schema (src/modules/promotions/promotions-types.ts). Storage: `stackable` / `exclusive` and the
# buy-X-get-Y numbers live inside the existing `promotion.rules` jsonb column — no db change (manager decision
# 2026-09-08: jsonb, no migration).
#
# ---- 1. PromotionInput.type enum gains buy_x_get_y --------------------------------------------------------
#    type: { type: string, enum: [percentage, fixed_amount, free_shipping, buy_x_get_y] }
#    (same change on the CHECK constraint is NOT needed: the db CHECK lists types — WAIT, it does:
#     type IN ('percentage','fixed_amount','free_shipping'). See note in the issue body: the CHECK must be
#     widened; that is one ALTER, included below as the only db line.)
#
# ---- 2. PromotionInput gains stacking fields and buy-X-get-Y rules ----------------------------------------
components:
  schemas:
    PromotionInput:
      # add to properties:
      properties:
        stackable:
          {
            type: boolean,
            default: false,
            description: may combine with other stackable promotions,
          }
        exclusive:
          {
            type: boolean,
            default: false,
            description: applies alone; the best exclusive wins over everything else,
          }
        rules:
          # add to rules.properties:
          properties:
            buy_quantity:
              { type: integer, minimum: 1, description: buy_x_get_y — units that must be bought }
            get_quantity:
              { type: integer, minimum: 1, description: buy_x_get_y — units discounted per bundle }
            get_discount_bp:
              {
                type: integer,
                minimum: 1,
                maximum: 10000,
                default: 10000,
                description: discount on the free units in basis points (10000 = free),
              }
    Promotion:
      # `stackable` and `exclusive` join the required list (server always returns them).
      required-add: [stackable, exclusive]

# ---- 3. New operation: update a promotion -----------------------------------------------------------------
paths:
  /admin/stores/{storeId}/promotions/{promotionId}:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { name: promotionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [pricing]
      operationId: getPromotion
      x-permission: { relation: viewer, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promotion' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [pricing]
      operationId: updatePromotion
      summary: Partial update; `code` and `type` are immutable (create a new promotion instead)
      x-permission: { relation: store_admin, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promotion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

# ---- 4. New schema ----------------------------------------------------------------------------------------
#    PromotionPatch: every PromotionInput property except `code` and `type`, all optional.
#
# ---- 5. The one db line (CHECK widening; jsonb carries everything else) -----------------------------------
#    ALTER TABLE promotion DROP CONSTRAINT promotion_type_check;
#    ALTER TABLE promotion ADD CONSTRAINT promotion_type_check
#      CHECK (type IN ('percentage','fixed_amount','free_shipping','buy_x_get_y'));
