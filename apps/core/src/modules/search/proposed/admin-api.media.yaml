# PROPOSED (CONTRACT CHANGE, window 9, task 2.3): additions to packages/contracts/openapi/admin-api.yaml.
# Kept here verbatim until the main window applies it; the search module's media router validates bodies
# against the same schemas (src/modules/search/media-types.ts) and mounts under these paths.
#
# ---- paths (insert after /admin/stores/{storeId}/products/{productId}/variants/...) ------------------------
paths:
  /admin/stores/{storeId}/media/upload-params:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    post:
      tags: [catalog]
      operationId: createMediaUploadParams
      summary: Signed parameters for a direct browser → Cloudinary upload (the API secret never leaves the server)
      x-permission: { relation: store_staff, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUploadRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUploadParams' }
              example:
                {
                  upload_url: https://api.cloudinary.com/v1_1/demo/image/upload,
                  cloud_name: demo,
                  api_key: '123456789012345',
                  timestamp: 1757332800,
                  signature: 5f2d1c0a9b8e7d6c5b4a39281706f5e4d3c2b1a0,
                  params:
                    {
                      folder: products/brand-a,
                      public_id: classic-tee-8f3a2c,
                      timestamp: 1757332800,
                    },
                  max_bytes: 10485760,
                  allowed_formats: [jpg, jpeg, png, webp, avif, gif],
                }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: The store has no media credentials configured (conflict)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/stores/{storeId}/products/{productId}/media:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { $ref: '#/components/parameters/ProductId' }
    get:
      tags: [catalog]
      operationId: listProductMedia
      x-permission: { relation: viewer, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK (ordered by position, contiguous from 0)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProductMedia' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [catalog]
      operationId: addProductMedia
      summary: Append one media item (alt text required); becomes the thumbnail when it is the first
      x-permission: { relation: store_staff, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductMediaInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductMedia' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/stores/{storeId}/products/{productId}/media/{mediaId}:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { $ref: '#/components/parameters/ProductId' }
      - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [catalog]
      operationId: updateProductMedia
      summary: Change alt / variant / position (move; the others shift, positions stay contiguous)
      x-permission: { relation: store_staff, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductMediaPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductMedia' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [catalog]
      operationId: deleteProductMedia
      summary: Remove one item; the remaining positions are renumbered 0..n-1 in their existing order
      x-permission: { relation: store_staff, object: 'store:{storeId}' }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

# ---- components/schemas ------------------------------------------------------------------------------------
components:
  schemas:
    MediaUploadRequest:
      type: object
      required: [product_id]
      properties:
        product_id:
          {
            type: string,
            format: uuid,
            description: the product the upload is for (must belong to the store),
          }
        filename: { type: string, maxLength: 200, description: used to derive a readable public_id }
        content_type: { type: string, maxLength: 100 }
    MediaUploadParams:
      type: object
      required:
        [upload_url, cloud_name, api_key, timestamp, signature, params, max_bytes, allowed_formats]
      properties:
        upload_url: { type: string, format: uri }
        cloud_name: { type: string }
        api_key: { type: string, description: public key id, not a secret }
        timestamp: { type: integer }
        signature:
          {
            type: string,
            description: SHA-1 over the sorted signed params + api secret (server side),
          }
        params:
          type: object
          description: every parameter that is part of the signature; send them verbatim with the file
          additionalProperties: { type: [string, integer] }
        max_bytes: { type: integer }
        allowed_formats: { type: array, items: { type: string } }
    ProductMediaInput:
      type: object
      required: [url, alt]
      properties:
        url: { type: string, format: uri, maxLength: 2000 }
        alt: { type: string, minLength: 1, maxLength: 500, description: required for accessibility }
        variant_id: { type: [string, 'null'], format: uuid }
        position: { type: integer, minimum: 0, description: insert at; default = append }
    ProductMediaPatch:
      type: object
      properties:
        alt: { type: string, minLength: 1, maxLength: 500 }
        variant_id: { type: [string, 'null'], format: uuid }
        position: { type: integer, minimum: 0 }
    ProductMedia:
      type: object
      required: [id, url, alt, position, variant_id, variants]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        alt: { type: [string, 'null'] }
        position: { type: integer }
        variant_id: { type: [string, 'null'], format: uuid }
        variants:
          type: object
          description: Cloudinary delivery URLs per rendition (the original url for non-Cloudinary hosts)
          required: [thumb, pdp, zoom]
          properties:
            thumb: { type: string }
            pdp: { type: string }
            zoom: { type: string }
