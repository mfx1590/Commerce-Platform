  # ---------------------------------------------------------------- search (contracts-v0.4, CONTRACT CHANGE #162: merchandising rules)
  /admin/stores/{storeId}/merchandising/rules:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [search]
      operationId: listMerchandisingRules
      summary: Pin / boost / bury rules of the store (all scopes)
      x-permission: { relation: store_staff, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MerchandisingRule' } }
              example:
                {
                  items:
                    [
                      {
                        id: 30000000-0000-4000-8000-000000000501,
                        scope:
                          { type: category, category_id: 00000000-0000-4000-8000-000000000201 },
                        pins: [00000000-0000-4000-8000-000000000301],
                        boosts: [{ product_id: 00000000-0000-4000-8000-000000000302, weight: 50 }],
                        buries: [],
                        enabled: true,
                        starts_at: null,
                        ends_at: null,
                        published_at: null,
                        created_at: '2026-09-08T12:00:00Z',
                        updated_at: '2026-09-08T12:00:00Z',
                      },
                    ],
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [search]
      operationId: createMerchandisingRule
      summary: Create the rule of a scope (one rule per store + scope; product ids must belong to the store)
      x-permission: { relation: store_admin, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchandisingRuleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchandisingRule' }
              examples:
                category: { $ref: '#/components/examples/MerchandisingRuleCategory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/stores/{storeId}/merchandising/rules/{ruleId}:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [search]
      operationId: getMerchandisingRule
      x-permission: { relation: store_staff, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchandisingRule' }
              examples:
                category: { $ref: '#/components/examples/MerchandisingRuleCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [search]
      operationId: updateMerchandisingRule
      summary: Partial update (scope is immutable; pins/boosts/buries replace the whole list when given)
      x-permission: { relation: store_admin, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchandisingRulePatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchandisingRule' }
              examples:
                category: { $ref: '#/components/examples/MerchandisingRuleCategory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [search]
      operationId: deleteMerchandisingRule
      x-permission: { relation: store_admin, object: 'store:{storeId}' }
      responses:
        '204': { description: Deleted (unpublished from the index on the next publish) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/stores/{storeId}/merchandising/publish:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    post:
      tags: [search]
      operationId: publishMerchandisingRules
      summary: Replace the Algolia rules of the store's index with every enabled rule; stamps published_at
      x-permission: { relation: store_admin, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [index, published, skipped]
                properties:
                  index: { type: string, description: Algolia index name }
                  published: { type: integer, minimum: 0 }
                  skipped:
                    { type: integer, minimum: 0, description: disabled or out-of-window rules }
              example: { index: brand-a_products, published: 3, skipped: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The store has no search credentials / index (conflict)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/stores/{storeId}/orders/{orderId}/shipments:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { $ref: '#/components/parameters/OrderId' }
    post:
      tags: [fulfillment]
      operationId: createShipment
      summary: Plan a shipment from a warehouse for some or all line items (emits shipment.created)
      x-permission: { relation: operations, object: 'organization:hq' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouse_id, items]
              properties:
                warehouse_id: { type: string, format: uuid }
                carrier: { type: string, default: manual }
                service: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [order_line_item_id, quantity]
                    properties:
                      order_line_item_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
              examples:
                pending: { $ref: '#/components/examples/ShipmentPending' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/shipments/{shipmentId}:
    parameters:
      - { name: shipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [fulfillment]
      operationId: updateShipment
      summary: Advance status / attach tracking and label (emits shipment.shipped / shipment.delivered)
      x-permission: { relation: operations, object: 'organization:hq' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  {
                    type: string,
                    enum: [label_created, shipped, in_transit, delivered, failed, cancelled],
                  }
                tracking_number: { type: string }
                tracking_url: { type: string }
                label_url: { type: string }
                cost_minor: { type: integer, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
              examples:
                pending: { $ref: '#/components/examples/ShipmentPending' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/shipments/{shipmentId}/pick:
    parameters:
      - { name: shipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [fulfillment]
      operationId: pickShipment
