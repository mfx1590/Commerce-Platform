    AttributionReport:
      type: object
      description: Aggregated from `attribution` rows joined to placed orders (cancelled orders excluded). Revenue = order total in the store's default currency.
      required: [from, to, touch, currency, totals, items]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        touch: { type: string, enum: [first, last] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        totals:
          type: object
          required: [orders_count, revenue]
          properties:
            orders_count: { type: integer, minimum: 0 }
            revenue: { $ref: '#/components/schemas/Money' }
        items:
          type: array
          items:
            type: object
            required: [utm_source, utm_medium, utm_campaign, campaign_id, orders_count, revenue]
            properties:
              utm_source: { type: [string, 'null'] }
              utm_medium: { type: [string, 'null'] }
              utm_campaign: { type: [string, 'null'] }
              campaign_id: { type: [string, 'null'], format: uuid }
              orders_count: { type: integer, minimum: 0 }
              revenue: { $ref: '#/components/schemas/Money' }
    PromotionReport:
      type: object
      required: [from, to, currency, items]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        items:
          type: array
          items:
            type: object
            required: [promotion_id, code, uses, discount_given, revenue]
            properties:
              promotion_id: { type: string, format: uuid }
              code: { type: [string, 'null'], description: null for automatic promotions }
              uses: { type: integer, minimum: 0 }
              discount_given: { $ref: '#/components/schemas/Money' }
              revenue: { $ref: '#/components/schemas/Money' }
    AbandonedCartReport:
      type: object
      description: |
        Counted from `cart_recovery` joined to `"order"`, over carts abandoned in [from, to). A cart counts once:
        a customer who opens the link three times and orders once is one recovery. `recovery_rate` is
        `recovered_count / abandoned_count`, 0 when nothing was abandoned. Values are in the store's default
        currency; carts in another currency are excluded, as in `reports/attribution`. Cancelled orders count in
        neither `recovered_count` nor `recovered_value` (the attribution report's house rule).
      required:
        [
          from,
          to,
          currency,
          abandoned_count,
          redeemed_count,
          recovered_count,
          recovery_rate,
          abandoned_value,
          recovered_value,
        ]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        abandoned_count: { type: integer, minimum: 0 }
        redeemed_count:
          {
            type: integer,
            minimum: 0,
            description: Recovery links that were opened (token redeemed),
          }
        recovered_count:
          { type: integer, minimum: 0, description: Abandoned carts that became an order }
        recovery_rate: { type: number, minimum: 0, maximum: 1 }
        abandoned_value: { $ref: '#/components/schemas/Money' }
        recovered_value:
          { $ref: '#/components/schemas/Money', description: Order totals of the recovered carts }
    MarketingDashboard:
      type: object
      description: Organization scope; one row per store, each in its own currency (no FX in v0.3)
      required: [from, to, items]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [store_id, store_code, currency, orders_count, revenue, top_campaign_id]
            properties:
              store_id: { type: string, format: uuid }
              store_code: { type: string }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              orders_count: { type: integer, minimum: 0 }
              revenue: { $ref: '#/components/schemas/Money' }
              top_campaign_id:
                {
                  type: [string, 'null'],
                  format: uuid,
                  description: Campaign with the most last-touch revenue in the window,
                }

