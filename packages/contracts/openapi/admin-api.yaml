    SegmentRules:
      # Frozen by window 17 in Phase 2.3 (#147, CONTRACT CHANGE #239). AND of ORs over a CLOSED predicate set:
      # every group in `all` must match, and a group matches when any one of its predicates does. `all: []`
      # matches every customer of the store. Unknown fields, operators or extra keys are rejected with 400
      # `validation_error`, naming the offending path (e.g. `rules.all[0].any[2].op`). The module publishes the
      # same grammar as a JSON Schema (`SEGMENT_RULES_SCHEMA` from apps/core/src/modules/marketing) so window
      # 16's messaging worker and the admin rule builder validate without duplicating it.
      type: object
      additionalProperties: false
      required: [v, all]
      properties:
        v: { type: integer, enum: [1] }
        all:
          type: array
          description: Groups combined with AND
          items:
            type: object
            additionalProperties: false
            required: [any]
            properties:
              any:
                type: array
                minItems: 1
                description: Predicates combined with OR
                items: { $ref: '#/components/schemas/SegmentPredicate' }
      example:
        v: 1
        all:
          - any:
              - { field: total_spent_minor, op: gte, value: 50000 }
              - { field: orders_count, op: gte, value: 3 }
          - any:
              - { field: consent, op: granted, value: email }
    SegmentPredicate:
      oneOf:
        - type: object
          additionalProperties: false
          required: [field, op, value]
          properties:
            field: { type: string, enum: [orders_count, total_spent_minor] }
            op: { type: string, enum: [gte, lte, eq] }
            value: { type: integer, description: 'total_spent_minor is in minor units' }
        - type: object
          additionalProperties: false
          required: [field, op, value]
          properties:
            field: { type: string, enum: [last_order_at] }
            op: { type: string, enum: [after, before] }
            value: { type: string, format: date-time }
        - type: object
          additionalProperties: false
          required: [field, op, value]
          properties:
            field: { type: string, enum: [tags] }
            op: { type: string, enum: [includes, excludes] }
            value: { type: string, minLength: 1, description: One tag from customer.metadata.tags }
        - type: object
          additionalProperties: false
          required: [field, op, value]
          properties:
            field: { type: string, enum: [consent] }
            op: { type: string, enum: [granted, not_granted] }
            value: { type: string, enum: [email, sms] }
        - type: object
          additionalProperties: false
          required: [field, op, value]
          properties:
            field: { type: string, enum: [country] }
            op: { type: string, enum: [in, not_in] }
            value:
              type: array
              minItems: 1
              maxItems: 200
              items: { type: string, pattern: '^[A-Z]{2}$' }
              description: Matched against the customer's DEFAULT SHIPPING address only
        - type: object
          additionalProperties: false
          required: [field, op, value]
          properties:
            field: { type: string, enum: [customer_group_ids] }
            op: { type: string, enum: [in, not_in] }
            value:
              type: array
              minItems: 1
              maxItems: 200
              items: { type: string, format: uuid }
    SegmentInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
