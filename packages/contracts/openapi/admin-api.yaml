  # ---------------------------------------------------------------- orders
  /admin/stores/{storeId}/orders:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [orders]
      operationId: listOrders
      x-permission: { relation: viewer, object: 'store:{storeId}' }
      parameters:
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [pending, confirmed, processing, completed, cancelled] },
          }
        - { name: payment_status, in: query, schema: { type: string } }
        - { name: fulfillment_status, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: display_id or email }
        - { name: placed_from, in: query, schema: { type: string, format: date-time } }
        - { name: placed_to, in: query, schema: { type: string, format: date-time } }
        - {
            name: sort,
            in: query,
            schema:
              { type: string, enum: [placed_at, display_id, total, status], default: placed_at },
          }
        - { $ref: '#/components/parameters/Order' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
              example:
                page: 1
                limit: 20
                total: 1
                items:
                  - {
                      id: 30000000-0000-4000-8000-000000000501,
                      display_id: 1000,
                      email: jane@example.com,
                      customer_id: 30000000-0000-4000-8000-000000000a01,
                      status: confirmed,
                      payment_status: captured,
                      fulfillment_status: unfulfilled,
                      total: { amount_minor: 2918, currency: EUR },
                      placed_at: '2026-09-04T10:00:00Z',
                    }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stores/{storeId}/orders/{orderId}:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { $ref: '#/components/parameters/OrderId' }
    get:
      tags: [orders]
      operationId: getOrder
      x-permission: { relation: viewer, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              examples:
                order: { $ref: '#/components/examples/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/stores/{storeId}/orders/{orderId}/cancel:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { $ref: '#/components/parameters/OrderId' }
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Cancel an unshipped order (releases stock, voids/refunds payment, emits order.cancelled)
      x-permission: { relation: store_admin, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              examples:
                order: { $ref: '#/components/examples/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/stores/{storeId}/orders/{orderId}/line-items/{lineItemId}:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { $ref: '#/components/parameters/OrderId' }
      - { name: lineItemId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [orders]
      operationId: updateOrderLineItem
      summary: Lower a line's quantity before fulfilment (totals recomputed, difference recorded in order.metadata.edits for the refund flow; no money moved)
      x-permission: { relation: store_admin, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  {
                    type: integer,
                    minimum: 1,
                    description: Must be lower than the current quantity,
                  }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              examples:
                order: { $ref: '#/components/examples/OrderDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [orders]
      operationId: cancelOrderLineItem
      summary: Cancel a line before fulfilment (the last line cannot be cancelled — cancel the order)
      x-permission: { relation: store_admin, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              examples:
                order: { $ref: '#/components/examples/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/stores/{storeId}/orders/{orderId}/refunds:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { $ref: '#/components/parameters/OrderId' }
    post:
      tags: [orders]
      operationId: createRefund
      summary: Refund part or all of a captured payment. `support` may refund up to the store's support_refund_limit_minor.
      x-permission: { relation: support, object: 'store:{storeId}' }
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, minLength: 8 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor, reason]
              properties:
                payment_id:
                  { type: string, format: uuid, description: Defaults to the captured payment }
                amount_minor: { type: integer, minimum: 1 }
                reason: { type: string, enum: [return, cancellation, goodwill, chargeback] }
                return_id: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
              example:
                {
                  id: 60000000-0000-4000-8000-000000000001,
                  order_id: 30000000-0000-4000-8000-000000000501,
                  payment_id: 60000000-0000-4000-8000-000000000101,
                  return_id: null,
                  amount: { amount_minor: 500, currency: EUR },
                  reason: goodwill,
                  status: succeeded,
                  provider_refund_id: re_mock,
                  created_at: '2026-09-04T11:00:00Z',
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/stores/{storeId}/orders/{orderId}/returns:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { $ref: '#/components/parameters/OrderId' }
    post:
      tags: [orders]
      operationId: createReturn
      x-permission: { relation: support, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                reason: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [order_line_item_id, quantity]
                    properties:
                      order_line_item_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Return' }
              example:
                {
                  id: 60000000-0000-4000-8000-000000000201,
                  order_id: 30000000-0000-4000-8000-000000000501,
                  status: requested,
                  reason: wrong size,
                  warehouse_id: null,
                  refund_id: null,
                  items:
                    [
                      {
                        order_line_item_id: 30000000-0000-4000-8000-000000000901,
                        quantity: 1,
                        condition: null,
                      },
                    ],
                  requested_at: '2026-09-05T10:00:00Z',
                  received_at: null,
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stores/{storeId}/returns/{returnId}/receive:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { name: returnId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [orders, fulfillment]
      operationId: receiveReturn
      summary: Warehouse received the goods (emits return.received, stock.moved)
      x-permission: { relation: operations, object: 'organization:hq' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouse_id, items]
              properties:
                warehouse_id: { type: string, format: uuid }
                items:
                  type: array
                  items:
                    type: object
                    required: [order_line_item_id, quantity, condition]
                    properties:
                      order_line_item_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                      condition: { type: string, enum: [resellable, damaged] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Return' }
              example:
                {
                  id: 60000000-0000-4000-8000-000000000201,
                  order_id: 30000000-0000-4000-8000-000000000501,
                  status: received,
                  reason: wrong size,
                  warehouse_id: 00000000-0000-4000-8000-000000000021,
                  refund_id: null,
                  items:
                    [
                      {
                        order_line_item_id: 30000000-0000-4000-8000-000000000901,
                        quantity: 1,
                        condition: resellable,
                      },
                    ],
                  requested_at: '2026-09-05T10:00:00Z',
                  received_at: '2026-09-08T10:00:00Z',
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- inventory
  /admin/inventory/levels:
    get:
      tags: [inventory]
      operationId: listInventoryLevels
      summary: Stock per variant per warehouse (store-scoped callers see their stores' variants only)
      x-permission: { relation: viewer, object: 'store:{store_id}' }
      parameters:
        - { name: store_id, in: query, schema: { type: string, format: uuid } }
        - { name: warehouse_id, in: query, schema: { type: string, format: uuid } }
        - { name: variant_id, in: query, schema: { type: string, format: uuid } }
        - { name: sku, in: query, schema: { type: string } }
        - {
            name: below_available,
            in: query,
            schema: { type: integer },
            description: Only rows with available below this,
          }
        - {
            name: sort,
            in: query,
            schema: { type: string, enum: [sku, available, on_hand], default: sku },
          }
        - { $ref: '#/components/parameters/Order' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
