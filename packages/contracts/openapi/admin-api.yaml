        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/shipments/{shipmentId}/pack:
    parameters:
      - { name: shipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [fulfillment]
      operationId: packShipment
      summary: Mark a picked shipment packed and ready for the carrier (emits fulfillment.packed)
      x-permission: { relation: operations, object: 'organization:hq' }
      requestBody:
        required: false
        content:
