openapi: 3.1.0
info:
  title: Admin API
  version: 0.4.6
  description: |
    API behind the admin application (Store view + HQ view). Every request carries a Keycloak staff-realm JWT.
    Store-scoped resources live under `/admin/stores/{storeId}/...`; the server checks the OpenFGA relation named
    in each operation's `x-permission` against `store:{storeId}` (or `organization:hq`) before doing anything.
    UI gating is a convenience; these checks are the security boundary. Every mutation writes `audit_log`.
    Money is `{ amount_minor, currency }`. Ids are uuids. Frozen at tag contracts-v0.1; 0.2.0 adds optional sort/order to list operations (additive);
    0.3.0 adds the marketing surface under `/admin/stores/{storeId}/marketing/…` and `/admin/marketing/…` (docs/marketing-scope.md, additive).
    0.4.0 adds search merchandising rules under `/admin/stores/{storeId}/merchandising/…` (CONTRACT CHANGE #162, additive) and
    documents `401` and `403` on every operation (#180): every `x-permission` can fail, and Prism can only mock what is written down.
    0.4.1 adds per-item product media + signed Cloudinary upload params (#168), `getPromotion`/`updatePromotion` with the
    `buy_x_get_y` type and `stackable`/`exclusive` (#189), and spells `ProductFeed` out so `status: error` validates (#194).
servers:
  - url: http://localhost:4011
    description: Prism mock (pnpm mock)
  - url: https://admin-api.example.com/v1
security:
  - staffToken: []
tags:
  - name: me
  - name: registry
  - name: catalog
  - name: pricing
  - name: orders
  - name: inventory
  - name: fulfillment
  - name: customers
  - name: roles
  - name: audit
  - name: marketing
  - name: search

paths:
  # ---------------------------------------------------------------- me
  /admin/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The principal, its organization, and the stores + relations it holds (drives navigation)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
              example:
                user:
                  {
                    id: 00000000-0000-4000-8000-000000000044,
                    email: store-admin@example.com,
                    display_name: Store Admin,
                  }
                organization: { id: 00000000-0000-4000-8000-000000000001, slug: hq, name: HQ }
                organization_relations: []
                stores:
                  - {
                      store_id: 00000000-0000-4000-8000-000000000031,
                      code: brand-a,
                      name: Brand A,
                      relations: [store_admin],
                    }
                  - {
                      store_id: 00000000-0000-4000-8000-000000000032,
                      code: brand-b,
                      name: Brand B,
                      relations: [store_admin],
                    }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- registry
  /admin/stores:
    get:
      tags: [registry]
      operationId: listStores
      summary: Stores the principal may access (all for HQ roles)
      x-permission: { relation: viewer, object: 'store:*' }
      parameters:
        - {
            name: sort,
            in: query,
            schema: { type: string, enum: [code, name, status, created_at], default: created_at },
          }
        - { $ref: '#/components/parameters/Order' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Store' } }
              example:
                page: 1
                limit: 20
                total: 3
                items:
                  - {
                      id: 00000000-0000-4000-8000-000000000031,
                      legal_entity_id: 00000000-0000-4000-8000-000000000011,
                      code: brand-a,
                      name: Brand A,
                      status: active,
                      default_currency: EUR,
                      default_locale: en-GB,
                      default_country: NL,
                      timezone: Europe/Amsterdam,
                      content_space_id: brand-a,
                      search_index: brand-a_products,
                      psp_account_id: null,
                      theme: {},
                      settings: {},
                      created_at: '2026-09-04T00:00:00Z',
                      updated_at: '2026-09-04T00:00:00Z',
                    }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [registry]
      operationId: createStore
      summary: Create a store (brand onboarding step 1)
      x-permission: { relation: owner, object: 'organization:hq' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Store' }
              examples:
                brandA: { $ref: '#/components/examples/StoreBrandA' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/stores/{storeId}:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [registry]
      operationId: getStore
      x-permission: { relation: viewer, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Store' }
              examples:
                brandA: { $ref: '#/components/examples/StoreBrandA' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [registry]
      operationId: updateStore
      x-permission: { relation: store_admin, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Store' }
              examples:
                brandA: { $ref: '#/components/examples/StoreBrandA' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stores/{storeId}/domains:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [registry]
      operationId: listDomains
      x-permission: { relation: viewer, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainList' }
              example:
                {
                  items:
                    [
                      {
                        id: 40000000-0000-4000-8000-000000000001,
                        hostname: shop.brand-a.example,
                        is_primary: true,
                        verified_at: '2026-09-04T00:00:00Z',
                      },
                    ],
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [registry]
      operationId: addDomain
      x-permission: { relation: owner, object: 'organization:hq' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname: { type: string }
                is_primary: { type: boolean, default: false }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
              example:
                {
                  id: 40000000-0000-4000-8000-000000000001,
                  hostname: shop.brand-a.example,
                  is_primary: true,
                  verified_at: null,
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/stores/{storeId}/sales-channels:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [registry]
      operationId: listSalesChannels
      x-permission: { relation: viewer, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SalesChannel' } }
              example:
                {
                  items:
                    [
                      {
                        id: 30000000-0000-4000-8000-000000000001,
                        code: web,
                        name: Web,
                        type: web,
                        is_active: true,
                      },
                    ],
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [registry]
      operationId: createSalesChannel
      x-permission: { relation: store_admin, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, type]
              properties:
                code: { type: string }
                name: { type: string }
                type: { type: string, enum: [web, app, marketplace, pos] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesChannel' }
              example:
                {
                  id: 30000000-0000-4000-8000-000000000002,
                  code: app,
                  name: Mobile app,
                  type: app,
                  is_active: true,
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/stores/{storeId}/api-keys:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [registry]
      operationId: listApiKeys
      x-permission: { relation: store_admin, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ApiKey' } }
              example:
                {
                  items:
                    [
                      {
                        id: 40000000-0000-4000-8000-000000000101,
                        name: storefront,
                        type: publishable,
                        key_prefix: pk_brand,
                        sales_channel_id: 30000000-0000-4000-8000-000000000001,
                        revoked_at: null,
                        created_at: '2026-09-04T00:00:00Z',
                      },
                    ],
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [registry]
      operationId: createApiKey
      summary: Returns the plain key exactly once
      x-permission: { relation: store_admin, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, enum: [publishable, secret] }
                sales_channel_id: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    required: [key]
                    properties:
                      key: { type: string, description: Shown once }
              example:
                {
                  id: 40000000-0000-4000-8000-000000000101,
                  name: storefront,
                  type: publishable,
                  key_prefix: pk_brand,
                  sales_channel_id: 30000000-0000-4000-8000-000000000001,
                  revoked_at: null,
                  created_at: '2026-09-04T00:00:00Z',
                  key: pk_branda_mock_0000000000000000,
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/warehouses:
    get:
      tags: [registry, inventory]
      operationId: listWarehouses
      x-permission: { relation: viewer, object: 'organization:hq' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Warehouse' } }
              example:
                items:
                  - {
                      id: 00000000-0000-4000-8000-000000000021,
                      code: wh-eu,
                      name: Rotterdam,
                      country: NL,
                      is_active: true,
                      priority: 10,
                    }
                  - {
                      id: 00000000-0000-4000-8000-000000000022,
                      code: wh-us,
                      name: New Jersey,
                      country: US,
                      is_active: true,
                      priority: 20,
                    }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/legal-entities:
    get:
      tags: [registry]
      operationId: listLegalEntities
      x-permission: { relation: finance, object: 'organization:hq' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LegalEntity' } }
              example:
                {
                  items:
                    [
                      {
                        id: 00000000-0000-4000-8000-000000000011,
                        code: le-brand-a,
                        name: Brand A B.V.,
                        country: NL,
                        currency: EUR,
                        vat_number: NL000000000B01,
                      },
                    ],
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- catalog
  /admin/stores/{storeId}/categories:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [catalog]
      operationId: listCategories
      x-permission: { relation: viewer, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Category' } }
              example:
                {
                  items:
                    [
                      {
                        id: 30000000-0000-4000-8000-000000000101,
                        handle: tops,
                        name: Tops,
                        parent_id: null,
                        position: 0,
                        is_active: true,
                      },
                    ],
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [catalog]
      operationId: createCategory
      x-permission: { relation: store_staff, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
              example:
                {
                  id: 30000000-0000-4000-8000-000000000101,
                  handle: tops,
                  name: Tops,
                  parent_id: null,
                  position: 0,
                  is_active: true,
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/stores/{storeId}/products:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [catalog]
      operationId: listProducts
      x-permission: { relation: viewer, object: 'store:{storeId}' }
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, archived] } }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [title, handle, status, created_at, updated_at],
                default: updated_at,
              },
          }
        - { $ref: '#/components/parameters/Order' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [catalog]
      operationId: createProduct
      x-permission: { relation: store_staff, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
              examples:
                classicTee: { $ref: '#/components/examples/ProductClassicTee' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/stores/{storeId}/products/{productId}:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [catalog]
      operationId: getProduct
      x-permission: { relation: viewer, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
              examples:
                classicTee: { $ref: '#/components/examples/ProductClassicTee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [catalog]
      operationId: updateProduct
      x-permission: { relation: store_staff, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
              examples:
                classicTee: { $ref: '#/components/examples/ProductClassicTee' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [catalog]
      operationId: archiveProduct
      summary: Archive (never hard-delete)
      x-permission: { relation: store_admin, object: 'store:{storeId}' }
      responses:
        '204': { description: Archived }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/stores/{storeId}/products/{productId}/publish:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [catalog]
      operationId: publishProduct
      summary: Publish (emits product.published)
      x-permission: { relation: store_staff, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
              examples:
                classicTee: { $ref: '#/components/examples/ProductClassicTee' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stores/{storeId}/products/{productId}/variants:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [catalog]
      operationId: createVariant
      x-permission: { relation: store_staff, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
              examples:
                mRed: { $ref: '#/components/examples/VariantMRed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/stores/{storeId}/variants/{variantId}:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [catalog]
      operationId: updateVariant
      x-permission: { relation: store_staff, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
              examples:
                mRed: { $ref: '#/components/examples/VariantMRed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/stores/{storeId}/media/upload-params:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    post:
      tags: [catalog]
      operationId: createMediaUploadParams
      summary: Signed parameters for a direct browser → Cloudinary upload (the API secret never leaves the server)
      x-permission: { relation: store_staff, object: 'store:{storeId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUploadRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUploadParams' }
              example:
                {
                  upload_url: https://api.cloudinary.com/v1_1/demo/image/upload,
                  cloud_name: demo,
                  api_key: '123456789012345',
                  timestamp: 1757332800,
                  signature: 5f2d1c0a9b8e7d6c5b4a39281706f5e4d3c2b1a0,
                  params:
                    {
                      folder: products/brand-a,
                      public_id: classic-tee-8f3a2c,
                      timestamp: 1757332800,
                    },
                  max_bytes: 10485760,
                  allowed_formats: [jpg, jpeg, png, webp, avif, gif],
                }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The store has no media credentials configured (conflict)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/stores/{storeId}/products/{productId}/media:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
      - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [catalog]
      operationId: listProductMedia
      summary: The product's media ordered by position (contiguous from 0)
      x-permission: { relation: viewer, object: 'store:{storeId}' }
      responses:
        '200':
          description: OK (ordered by position, contiguous from 0)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProductMedia' } }
              example:
                {
                  items:
                    [
