components:
  securitySchemes:
    staffToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak staff realm token

  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Order:
      name: order
      in: query
      description: Sort direction. Ignored unless `sort` is present.
      schema: { type: string, enum: [asc, desc], default: desc }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              code: validation_error,
              message: handle must be kebab-case,
              details: { field: handle },
            }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: unauthorized, message: Missing bearer token, details: {} }
    Forbidden:
      description: Permission check failed (OpenFGA)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              code: forbidden,
              message: 'requires finance on organization:hq',
              details: { relation: finance, object: 'organization:hq' },
            }
    NotFound:
      description: Not found in the caller's scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: not_found, message: Not found, details: {} }
    Conflict:
      description: Uniqueness or state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: conflict, message: handle already exists, details: { field: handle } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          {
            type: string,
            description: 'validation_error, unauthorized, forbidden, not_found, conflict, out_of_stock, payment_failed, internal',
          }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    Page:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    Address:
      type: object
      required: [first_name, last_name, line1, city, postal_code, country]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        company: { type: [string, 'null'] }
        line1: { type: string }
        line2: { type: [string, 'null'] }
        city: { type: string }
        region: { type: [string, 'null'] }
        postal_code: { type: string }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        phone: { type: [string, 'null'] }
    Relation:
      type: string
      enum: [owner, finance, operations, store_admin, store_staff, support, analyst]
      description: OpenFGA relations (ADR 0002). `viewer` in x-permission means any relation on the object.

    Principal:
      type: object
      required: [user, organization, organization_relations, stores]
      properties:
        user:
          type: object
          required: [id, email, display_name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            display_name: { type: string }
        organization:
          type: object
          required: [id, slug, name]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
        organization_relations:
          type: array
          items: { $ref: '#/components/schemas/Relation' }
        stores:
          type: array
          items:
            type: object
            required: [store_id, code, name, relations]
            properties:
              store_id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
              relations: { type: array, items: { $ref: '#/components/schemas/Relation' } }

    StoreInput:
      type: object
      properties:
        legal_entity_id: { type: string, format: uuid }
        code: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string }
        status: { type: string, enum: [draft, active, paused, archived] }
        default_currency: { type: string, pattern: '^[A-Z]{3}$' }
        default_locale: { type: string }
        default_country: { type: string, pattern: '^[A-Z]{2}$' }
        timezone: { type: string }
        currencies: { type: array, items: { type: string } }
        locales: { type: array, items: { type: string } }
        content_space_id: { type: [string, 'null'] }
        search_index: { type: [string, 'null'] }
        theme: { type: object, additionalProperties: true }
        settings: { type: object, additionalProperties: true }
    Store:
      type: object
      required:
        [
          id,
          legal_entity_id,
          code,
          name,
          status,
          default_currency,
          default_locale,
          default_country,
          timezone,
          content_space_id,
          search_index,
          psp_account_id,
          theme,
          settings,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [draft, active, paused, archived] }
        default_currency: { type: string }
        default_locale: { type: string }
        default_country: { type: string }
        timezone: { type: string }
        content_space_id: { type: [string, 'null'] }
        search_index: { type: [string, 'null'] }
        psp_account_id: { type: [string, 'null'] }
        theme: { type: object, additionalProperties: true }
        settings: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Domain:
      type: object
      required: [id, hostname, is_primary, verified_at]
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        is_primary: { type: boolean }
        verified_at: { type: [string, 'null'], format: date-time }
    DomainList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Domain' } }
    SalesChannel:
      type: object
      required: [id, code, name, type, is_active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [web, app, marketplace, pos] }
        is_active: { type: boolean }
    ApiKey:
      type: object
      required: [id, name, type, key_prefix, sales_channel_id, revoked_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [publishable, secret] }
        key_prefix: { type: string }
        sales_channel_id: { type: [string, 'null'], format: uuid }
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    Warehouse:
      type: object
      required: [id, code, name, country, is_active, priority]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        country: { type: string }
        is_active: { type: boolean }
        priority: { type: integer }
    LegalEntity:
      type: object
      required: [id, code, name, country, currency, vat_number]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        country: { type: string }
        currency: { type: string }
        vat_number: { type: [string, 'null'] }

    CategoryInput:
      type: object
      required: [handle, name]
      properties:
        handle: { type: string }
        name: { type: string }
        parent_id: { type: [string, 'null'], format: uuid }
        description: { type: string }
        position: { type: integer }
        is_active: { type: boolean }
    Category:
      type: object
      required: [id, handle, name, parent_id, position, is_active]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        name: { type: string }
        parent_id: { type: [string, 'null'], format: uuid }
        position: { type: integer }
        is_active: { type: boolean }
    ProductInput:
      type: object
      properties:
        handle: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        category_id: { type: [string, 'null'], format: uuid }
        brand_name: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        attributes: { type: object, additionalProperties: true }
        seo: { type: object, additionalProperties: true }
        options:
          type: array
          items:
            type: object
            required: [name, values]
            properties:
              name: { type: string }
              values: { type: array, items: { type: string } }
        media:
          type: array
          items:
            type: object
            required: [url]
            properties:
              url: { type: string }
              alt: { type: [string, 'null'] }
              position: { type: integer }
              variant_id: { type: [string, 'null'], format: uuid }
    Product:
      type: object
      required:
        [
          id,
          handle,
          title,
          subtitle,
          description,
          status,
          category_id,
          brand_name,
          tags,
          attributes,
          seo,
          thumbnail_url,
          options,
          variants,
          media,
          published_at,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [draft, published, archived] }
        category_id: { type: [string, 'null'], format: uuid }
        brand_name: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        attributes: { type: object, additionalProperties: true }
        seo: { type: object, additionalProperties: true }
        thumbnail_url: { type: [string, 'null'] }
        options:
          type: array
          items:
            type: object
            required: [id, name, values, position]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              values: { type: array, items: { type: string } }
              position: { type: integer }
        variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
        media:
          type: array
          items:
            type: object
            required: [id, url, alt, position, variant_id]
            properties:
              id: { type: string, format: uuid }
              url: { type: string }
              alt: { type: [string, 'null'] }
              position: { type: integer }
              variant_id: { type: [string, 'null'], format: uuid }
        published_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VariantInput:
      type: object
      properties:
        sku: { type: string }
        barcode: { type: [string, 'null'] }
        title: { type: string }
        options: { type: object, additionalProperties: { type: string } }
        manage_inventory: { type: boolean }
        allow_backorder: { type: boolean }
        weight_g: { type: [integer, 'null'] }
        dimensions_mm:
          type: [object, 'null']
          properties:
            l: { type: integer }
            w: { type: integer }
            h: { type: integer }
        hs_code: { type: [string, 'null'] }
        origin_country: { type: [string, 'null'] }
        position: { type: integer }
        prices:
          type: array
          description: Convenience — written to the store's default price list per currency
          items:
            type: object
            required: [currency, amount_minor]
            properties:
              currency: { type: string }
              amount_minor: { type: integer, minimum: 0 }
              compare_at_minor: { type: [integer, 'null'] }
    Variant:
      type: object
      required:
        [
          id,
          product_id,
          sku,
          barcode,
          title,
          options,
          manage_inventory,
          allow_backorder,
          weight_g,
          dimensions_mm,
          hs_code,
          origin_country,
          position,
          prices,
          inventory,
        ]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        barcode: { type: [string, 'null'] }
        title: { type: string }
        options: { type: object, additionalProperties: { type: string } }
        manage_inventory: { type: boolean }
        allow_backorder: { type: boolean }
        weight_g: { type: [integer, 'null'] }
        dimensions_mm:
          type: [object, 'null']
          properties:
            l: { type: integer }
            w: { type: integer }
            h: { type: integer }
        hs_code: { type: [string, 'null'] }
        origin_country: { type: [string, 'null'] }
        position: { type: integer }
        prices:
          type: array
          items:
            type: object
            required: [price_list_id, currency, amount_minor, compare_at_minor, min_quantity]
            properties:
              price_list_id: { type: string, format: uuid }
              currency: { type: string }
              amount_minor: { type: integer }
              compare_at_minor: { type: [integer, 'null'] }
              min_quantity: { type: integer }
        inventory:
          type: array
          items:
            type: object
            required: [warehouse_id, on_hand, reserved, available]
            properties:
              warehouse_id: { type: string, format: uuid }
              on_hand: { type: integer }
              reserved: { type: integer }
              available: { type: integer }

    MediaUploadRequest:
      type: object
      required: [product_id]
      properties:
        product_id:
          {
            type: string,
            format: uuid,
            description: the product the upload is for (must belong to the store),
          }
        filename: { type: string, maxLength: 200, description: used to derive a readable public_id }
        content_type: { type: string, maxLength: 100 }
    MediaUploadParams:
      type: object
      required:
        [upload_url, cloud_name, api_key, timestamp, signature, params, max_bytes, allowed_formats]
      properties:
        upload_url: { type: string, format: uri }
        cloud_name: { type: string }
        api_key: { type: string, description: public key id, not a secret }
        timestamp: { type: integer }
        signature:
          {
            type: string,
            description: SHA-1 over the sorted signed params + api secret (server side),
          }
        params:
          type: object
          description: every parameter that is part of the signature; send them verbatim with the file
          additionalProperties: { type: [string, integer] }
        max_bytes: { type: integer }
        allowed_formats: { type: array, items: { type: string } }
    ProductMediaInput:
      type: object
      required: [url, alt]
      properties:
        url: { type: string, format: uri, maxLength: 2000 }
        alt: { type: string, minLength: 1, maxLength: 500, description: required for accessibility }
        variant_id: { type: [string, 'null'], format: uuid }
        position: { type: integer, minimum: 0, description: insert at; default = append }
    ProductMediaPatch:
      type: object
      properties:
        alt: { type: string, minLength: 1, maxLength: 500 }
        variant_id: { type: [string, 'null'], format: uuid }
        position: { type: integer, minimum: 0 }
    ProductMedia:
      type: object
      required: [id, url, alt, position, variant_id, variants]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        alt: { type: [string, 'null'] }
        position: { type: integer }
        variant_id: { type: [string, 'null'], format: uuid }
        variants:
          type: object
          description: Cloudinary delivery URLs per rendition (the original url for non-Cloudinary hosts)
          required: [thumb, pdp, zoom]
          properties:
            thumb: { type: string }
            pdp: { type: string }
            zoom: { type: string }

    PriceListInput:
      type: object
      required: [code, name, type, currency]
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [default, sale, override] }
        currency: { type: string }
        customer_group_id: { type: [string, 'null'], format: uuid }
        sales_channel_id: { type: [string, 'null'], format: uuid }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [active, draft, expired] }
        priority: { type: integer }
    PriceList:
      allOf:
        - $ref: '#/components/schemas/PriceListInput'
        - type: object
          required: [id, customer_group_id, sales_channel_id, starts_at, ends_at, status, priority]
          properties:
            id: { type: string, format: uuid }
    PromotionRules:
      type: object
      description: |
        Conditions of a promotion; `buy_quantity` / `get_quantity` / `get_discount_bp` apply to `buy_x_get_y` only
        (0.4.1, #189). Stored in the `promotion.rules` jsonb column together with `stackable` / `exclusive`.
      properties:
        min_subtotal_minor: { type: integer }
        product_ids: { type: array, items: { type: string, format: uuid } }
        category_ids: { type: array, items: { type: string, format: uuid } }
        customer_group_ids: { type: array, items: { type: string, format: uuid } }
        sales_channel_ids: { type: array, items: { type: string, format: uuid } }
        first_order_only: { type: boolean }
        buy_quantity:
          { type: integer, minimum: 1, description: buy_x_get_y — units that must be bought }
        get_quantity:
          { type: integer, minimum: 1, description: buy_x_get_y — units discounted per bundle }
        get_discount_bp:
          {
            type: integer,
            minimum: 1,
            maximum: 10000,
            default: 10000,
            description: discount on the free units in basis points (10000 = free),
          }
    PromotionInput:
      type: object
      required: [name, type]
      properties:
        code: { type: [string, 'null'] }
        name: { type: string }
        type: { type: string, enum: [percentage, fixed_amount, free_shipping, buy_x_get_y] }
        value:
          { type: integer, description: basis points for percentage, minor units for fixed_amount }
        currency: { type: [string, 'null'] }
        rules: { $ref: '#/components/schemas/PromotionRules' }
        usage_limit: { type: [integer, 'null'] }
        per_customer_limit: { type: [integer, 'null'] }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [active, draft, disabled] }
        stackable:
          {
            type: boolean,
            default: false,
            description: may combine with other stackable promotions,
          }
        exclusive:
          {
            type: boolean,
            default: false,
            description: applies alone; the best exclusive wins over everything else,
          }
    PromotionPatch:
      type: object
      description: Every PromotionInput property except `code` and `type` (immutable), all optional (0.4.1, #189)
      properties:
        name: { type: string }
        value:
          { type: integer, description: basis points for percentage, minor units for fixed_amount }
        currency: { type: [string, 'null'] }
        rules: { $ref: '#/components/schemas/PromotionRules' }
        usage_limit: { type: [integer, 'null'] }
        per_customer_limit: { type: [integer, 'null'] }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [active, draft, disabled] }
        stackable: { type: boolean }
        exclusive: { type: boolean }
    Promotion:
      allOf:
        - $ref: '#/components/schemas/PromotionInput'
        - type: object
          required:
            [
              id,
              code,
              value,
              currency,
              rules,
              usage_limit,
              usage_count,
              per_customer_limit,
              starts_at,
              ends_at,
              status,
              stackable,
              exclusive,
            ]
          properties:
            id: { type: string, format: uuid }
            usage_count: { type: integer }

    LineItem:
      type: object
      required:
        [
          id,
          variant_id,
          sku,
          title,
          variant_title,
          thumbnail_url,
          quantity,
          unit_price,
          discount,
          tax_rate_bp,
          tax,
          total,
          fulfilled_quantity,
          returned_quantity,
        ]
      properties:
        id: { type: string, format: uuid }
        variant_id: { type: [string, 'null'], format: uuid }
        sku: { type: string }
        title: { type: string }
        variant_title: { type: string }
        thumbnail_url: { type: [string, 'null'] }
        quantity: { type: integer }
        unit_price: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        tax_rate_bp: { type: integer }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        fulfilled_quantity: { type: integer }
        returned_quantity: { type: integer }
    Totals:
      type: object
      required: [subtotal, discount, shipping, tax, total]
      properties:
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        shipping: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    OrderSummary:
      type: object
      required:
        [
          id,
          display_id,
          email,
          customer_id,
          status,
          payment_status,
          fulfillment_status,
          total,
          placed_at,
        ]
      properties:
        id: { type: string, format: uuid }
        display_id: { type: integer }
        email: { type: string }
        customer_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [pending, confirmed, processing, completed, cancelled] }
        payment_status:
          {
            type: string,
            enum: [awaiting, authorized, captured, partially_refunded, refunded, failed],
          }
        fulfillment_status:
          {
            type: string,
            enum: [unfulfilled, partially_fulfilled, fulfilled, partially_returned, returned],
          }
        total: { $ref: '#/components/schemas/Money' }
        placed_at: { type: string, format: date-time }
    Payment:
      type: object
      required: [id, provider, provider_payment_id, amount, status, fee_minor, captured_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        provider_payment_id: { type: [string, 'null'] }
        amount: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [pending, authorized, captured, failed, cancelled] }
        fee_minor: { type: [integer, 'null'] }
        captured_at: { type: [string, 'null'], format: date-time }
    Refund:
      type: object
      required:
        [
          id,
          order_id,
          payment_id,
          return_id,
          amount,
          reason,
          status,
          provider_refund_id,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        payment_id: { type: string, format: uuid }
        return_id: { type: [string, 'null'], format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string, enum: [return, cancellation, goodwill, chargeback] }
        status: { type: string, enum: [pending, succeeded, failed] }
        provider_refund_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Shipment:
      type: object
      required:
        [
          id,
          order_id,
          warehouse_id,
          carrier,
          service,
          tracking_number,
          tracking_url,
          label_url,
          cost,
          status,
          items,
          shipped_at,
          delivered_at,
        ]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        carrier: { type: string }
        service: { type: [string, 'null'] }
        tracking_number: { type: [string, 'null'] }
        tracking_url: { type: [string, 'null'] }
        label_url: { type: [string, 'null'] }
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        status:
          {
            type: string,
            enum:
              [
                pending,
                picking,
                packed,
                label_created,
                shipped,
                in_transit,
                delivered,
                failed,
                cancelled,
              ],
          }
        items:
          type: array
          items:
            type: object
            required: [order_line_item_id, quantity]
            properties:
              order_line_item_id: { type: string, format: uuid }
              quantity: { type: integer }
        shipped_at: { type: [string, 'null'], format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
    Return:
      type: object
      required:
        [id, order_id, status, reason, warehouse_id, refund_id, items, requested_at, received_at]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        status: { type: string, enum: [requested, approved, received, refunded, rejected] }
        reason: { type: [string, 'null'] }
        warehouse_id: { type: [string, 'null'], format: uuid }
        refund_id: { type: [string, 'null'], format: uuid }
        items:
          type: array
          items:
            type: object
            required: [order_line_item_id, quantity, condition]
            properties:
              order_line_item_id: { type: string, format: uuid }
              quantity: { type: integer }
              condition: { type: [string, 'null'], enum: [resellable, damaged, null] }
        requested_at: { type: string, format: date-time }
        received_at: { type: [string, 'null'], format: date-time }
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required:
            [
              sales_channel_id,
              currency,
              locale,
              items,
              shipping_address,
              billing_address,
              shipping_method,
              promotion_codes,
              totals,
              payments,
              refunds,
              shipments,
              returns,
              cancel_reason,
              metadata,
            ]
          properties:
