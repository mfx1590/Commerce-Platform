openapi: 3.1.0
info:
  title: Store API
  version: 0.5.8
  description: |
    Storefront-facing API. Every request carries `X-Publishable-Key` (a `store_api_key` of type `publishable`),
    which resolves the store and sales channel; the core refuses requests without it. Customer-authenticated
    routes additionally send a Keycloak customers-realm JWT as a Bearer token.
    Money is `{ amount_minor, currency }`. Ids are uuids. Frozen at tag contracts-v0.1; 0.2.0 adds optional cart/order `metadata` (additive);
    0.3.0 adds the optional `currency` query on listProducts/getProduct (additive);
    0.3.1 adds the `price_changed` error code on completeCart's 409 (additive);
    0.4.0 adds POST /store/cart-recovery/{token} (additive);
    0.5.0 adds the typed review shape — Product.review_summary and GET /store/products/{handle}/reviews (additive).
    0.5.4 adds the optional `Store.payment.methods` (`card` | `invoice`) the checkout may offer (#354/#358, additive).
    0.5.5 adds `voided` to the order's `payment_status` (authorized → voided when the order is cancelled; terminal; #466, additive).
    0.5.6 adds customer self-service — updateMyAddress, deleteMyAddress (200 with the remaining addresses), requestMyExport and deleteMe (#482, additive).
servers:
  - url: http://localhost:4010
    description: Prism mock (pnpm mock)
  - url: https://api.{brandDomain}/v1
    description: Production edge (Cloudflare → Kong → core)
    variables:
      brandDomain:
        default: brand-a.example
security:
  - publishableKey: []
tags:
  - name: store
  - name: catalog
  - name: cart
  - name: checkout
  - name: orders
  - name: customers

paths:
  /store:
    get:
      tags: [store]
      operationId: getStore
      summary: The store resolved from the publishable key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Store' }
              examples:
                brandA: { $ref: '#/components/examples/StoreBrandA' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /store/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: Active categories as a flat list with parent_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
              example:
                items:
                  - {
                      id: 30000000-0000-4000-8000-000000000101,
                      handle: tops,
                      name: Tops,
                      parent_id: null,
                      position: 0,
                    }
                  - {
                      id: 30000000-0000-4000-8000-000000000102,
                      handle: t-shirts,
                      name: T-shirts,
                      parent_id: 30000000-0000-4000-8000-000000000101,
                      position: 0,
                    }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /store/products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: Published products, paginated
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Full-text query }
        - {
            name: category,
            in: query,
            schema: { type: string },
            description: Category handle (includes children),
          }
        - { name: tag, in: query, schema: { type: string } }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [relevance, price_asc, price_desc, newest],
                default: relevance,
              },
          }
        - { $ref: '#/components/parameters/Currency' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ProductSummary' }
              examples:
                page1:
                  value:
                    page: 1
                    limit: 24
                    total: 200
                    items:
                      - id: 30000000-0000-4000-8000-000000000201
                        handle: classic-tee
                        title: Classic Tee
                        thumbnail_url: https://res.cloudinary.com/demo/image/upload/classic-tee.jpg
                        price: { amount_minor: 1999, currency: EUR }
                        compare_at_price: null
                        category_handle: t-shirts
                        tags: [basics]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /store/products/{handle}:
    get:
      tags: [catalog]
      operationId: getProduct
      summary: One published product with variants, options, media and prices
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Currency' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
              examples:
                classicTee: { $ref: '#/components/examples/ProductClassicTee' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /store/products/{handle}/reviews:
    get:
      operationId: listProductReviews
      summary: Published reviews for a product, newest first
      tags: [catalog]
      parameters:
        # `handle` is declared inline on getProduct too — there is no ProductHandle component.
        - { name: handle, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
              example:
                items:
                  - id: 00000000-0000-4000-8000-000000000901
                    rating: 5
                    title: Exactly as described
                    body: Wore it all summer.
                    author: Ada L.
                    created_at: '2026-09-01T10:00:00Z'
                    verified_purchase: true
                total: 1
                page: 1
                limit: 24
                summary: { count: 1, average: 5 }
        '404': { $ref: '#/components/responses/NotFound' }

  /store/carts:
    post:
      tags: [cart]
      operationId: createCart
      summary: Create an empty cart for the resolved store and sales channel
      description: |
        With a valid customer token the new cart is linked to that customer (the store-level customer row is
        resolved or provisioned from the token, as on `/store/customers/me`). Without a token the cart is a
        guest cart, as before. A token that is sent but invalid, expired or bound to another store is a 401 —
        it is never silently ignored.
      security:
        - publishableKey: []
        - publishableKey: []
          customerToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                country:
                  {
                    type: string,
                    pattern: '^[A-Z]{2}$',
                    description: Shipping destination; defaults to store.default_country,
                  }
                currency:
                  {
                    type: string,
                    pattern: '^[A-Z]{3}$',
                    description: Must be enabled for the store,
                  }
                locale: { type: string }
                metadata: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
              examples:
                empty: { $ref: '#/components/examples/CartEmpty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: >-
            Only with a customer token: the token's customer cannot be resolved because its email already
            belongs to another account in this store (`conflict`). No cart was created. Without a token
            this operation never answers 409.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }

  /store/carts/{cartId}:
    parameters:
      - { $ref: '#/components/parameters/CartId' }
    get:
      tags: [cart]
      operationId: getCart
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
              examples:
                withItem: { $ref: '#/components/examples/CartWithItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [cart]
      operationId: updateCart
      summary: Set email, addresses, shipping option, promotion codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                shipping_address: { $ref: '#/components/schemas/Address' }
                billing_address: { $ref: '#/components/schemas/Address' }
                shipping_option_id: { type: string, format: uuid }
                promotion_codes: { type: array, items: { type: string } }
                country: { type: string, pattern: '^[A-Z]{2}$' }
                metadata: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
              examples:
                withItem: { $ref: '#/components/examples/CartWithItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /store/carts/{cartId}/line-items:
    parameters:
      - { $ref: '#/components/parameters/CartId' }
    post:
      tags: [cart]
      operationId: addLineItem
      summary: Add a variant (or increase its quantity)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant_id, quantity]
              properties:
                variant_id: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
              examples:
                withItem: { $ref: '#/components/examples/CartWithItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  code: out_of_stock,
                  message: Only 2 left,
                  details: { variant_id: 30000000-0000-4000-8000-000000000301, available: 2 },
                }

  /store/carts/{cartId}/line-items/{lineItemId}:
    parameters:
      - { $ref: '#/components/parameters/CartId' }
      - { name: lineItemId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [cart]
      operationId: updateLineItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
              examples:
                withItem: { $ref: '#/components/examples/CartWithItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [cart]
      operationId: removeLineItem
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
              examples:
                empty: { $ref: '#/components/examples/CartEmpty' }
        '404': { $ref: '#/components/responses/NotFound' }

  /store/carts/{cartId}/shipping-options:
    parameters:
      - { $ref: '#/components/parameters/CartId' }
    get:
      tags: [checkout]
      operationId: listShippingOptions
      summary: Shipping options valid for the cart's destination and contents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ShippingOption' }
              example:
                items:
                  - {
                      id: 30000000-0000-4000-8000-000000000401,
                      code: standard,
                      name: Standard (2–4 days),
                      carrier: manual,
                      price: { amount_minor: 499, currency: EUR },
                    }
                  - {
                      id: 30000000-0000-4000-8000-000000000402,
                      code: express,
                      name: Express (next day),
                      carrier: manual,
                      price: { amount_minor: 999, currency: EUR },
                    }
        '404': { $ref: '#/components/responses/NotFound' }

  /store/carts/{cartId}/payment-session:
    parameters:
      - { $ref: '#/components/parameters/CartId' }
    post:
      tags: [checkout]
      operationId: createPaymentSession
      summary: Create a PSP session; the storefront renders hosted fields with `client_secret`. Card data never reaches our API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [stripe, manual] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSession' }
              example:
                {
                  provider: stripe,
                  session_id: pi_3Mock,
                  client_secret: pi_3Mock_secret_mock,
                  status: pending,
                  amount: { amount_minor: 2918, currency: EUR },
                }
        '400': { $ref: '#/components/responses/BadRequest' }

  /store/carts/{cartId}/complete:
    parameters:
      - { $ref: '#/components/parameters/CartId' }
    post:
      tags: [checkout]
      operationId: completeCart
      summary: Place the order (reserve stock, authorize payment, emit order.placed)
      description: |
        With a valid customer token the order is placed for that customer: a guest cart is linked to the
        customer inside the placement transaction, so the order appears in `listMyOrders` without relying on
        the email match. A cart already linked to ANOTHER customer is refused with 409 `conflict` and nothing
        is placed. Without a token the order keeps the cart's link (a guest cart places a guest order, as
        before). A token that is sent but invalid, expired or bound to another store is a 401. The email on
        the order stays the cart's checkout email. A replay with the same Idempotency-Key answers the stored
        order and changes no link.
      security:
        - publishableKey: []
        - publishableKey: []
          customerToken: []
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, minLength: 8 },
          }
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              examples:
                placed: { $ref: '#/components/examples/OrderPlaced' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402':
          description: Payment not authorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: payment_failed, message: Card declined, details: {} }
        '409':
          description: >-
            Cart already completed (`cart_completed`), stock no longer available (`out_of_stock`), the cart is
            linked to another customer than the token's (`conflict`), or a line's price
            changed since the cart was last priced (`price_changed`). On `price_changed` nothing was placed or
            authorized and the cart has been re-priced: read the cart again, show the new prices, create the payment
            session again for the new total, then retry (the same Idempotency-Key is fine — no order exists for it).
            `unit_price_minor: null` in an item means the variant has no applicable price in the cart's currency any
            more (not sellable): the storefront removes the line.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                cart_completed:
                  value:
                    {
                      code: cart_completed,
                      message: Cart already completed,
                      details: { order_id: 30000000-0000-4000-8000-000000000501 },
                    }
                price_changed:
                  value:
                    {
                      code: price_changed,
                      message: One or more prices changed,
                      details:
                        {
                          currency: EUR,
                          items:
                            [
                              {
                                line_item_id: 30000000-0000-4000-8000-000000000601,
                                variant_id: 30000000-0000-4000-8000-000000000201,
                                previous_unit_price_minor: 1999,
                                unit_price_minor: 2499,
                              },
                            ],
                        },
                    }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /store/cart-recovery/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, minLength: 32, maxLength: 128 }
    post:
      tags: [cart]
      operationId: recoverCart
      summary: Redeem a recovery token and return the cart it belongs to
      description: |
        Single use. The token is minted when a cart is abandoned, hashed before storage, and expires (7 days by
        default). Unknown, already-redeemed and expired tokens all answer the SAME 404 — a recovery link is a
        bearer credential, and distinguishing the cases would let anyone probe which tokens exist. The cart is
        returned reactivated (status `active`), so the storefront can carry straight on to checkout. POST, not
        GET: redemption is single-use and mutating, and a GET would be burned by link prefetchers before the
        customer clicks — the storefront's own /cart/recover/{token} page is the GET, POSTing here server-side.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
              examples:
                withItem: { $ref: '#/components/examples/CartWithItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The cart was already completed ("you already placed this order" — leaks nothing, the caller holds a valid token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /store/orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Order lookup by id plus the email used at checkout (or the customer's token)
      security:
        - publishableKey: []
        - publishableKey: []
          customerToken: []
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: email, in: query, required: false, schema: { type: string, format: email } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              examples:
                placed: { $ref: '#/components/examples/OrderPlaced' }
        '404': { $ref: '#/components/responses/NotFound' }

  /store/customers:
    post:
      tags: [customers]
      operationId: registerCustomer
      summary: Link the authenticated Keycloak customer to this store (creates the store-level customer row)
      description: |
        Resolves or creates the store-level customer row for the token's identity, then applies the supplied
        names and consent. 201 when this call created the row, 200 when it already existed (every
        `/store/customers/me` operation creates it on first use). The subject and the email always come
        from the customer token: a body `email` that differs from the token's is a 400.
      security:
        - publishableKey: []
          customerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                first_name: { type: string }
                last_name: { type: string }
                marketing_consent: { type: boolean, default: false }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
              examples:
                jane: { $ref: '#/components/examples/CustomerJane' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: The customer row already existed; the supplied names and consent were applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
              examples:
                jane: { $ref: '#/components/examples/CustomerJane' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }

  /store/customers/me:
    get:
      tags: [customers]
      operationId: getMe
      description: |
        The store-level customer row is created from the verified token on first use (subject and email from
        the token, `marketing_consent` false), so a signed-in customer never needs to register first.
      security:
        - publishableKey: []
          customerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
              examples:
                jane: { $ref: '#/components/examples/CustomerJane' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }
    patch:
      tags: [customers]
      operationId: updateMe
      description: |
        `marketing_consent` stays the one-checkbox shortcut and a change of it also writes the consent ledger
        (`source: storefront`, `policy_version` = the store's current `settings.privacy.policy_version`,
        `unversioned` when unset); `getMyConsents` / `putMyConsents` read and answer per purpose.
      security:
        - publishableKey: []
          customerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string }
                marketing_consent: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
              examples:
                jane: { $ref: '#/components/examples/CustomerJane' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [customers]
      operationId: deleteMe
      summary: Delete my account (GDPR erasure of this store's customer row)
      description: |
        Erases the customer row of the token in THIS store, the same way the Admin API `eraseCustomer` does:
        status `erased`, email replaced by a placeholder, names, phone and consent cleared, every address
        deleted, orders kept (linked by customer id only, legal-obligation retention). One `customer.erased`
        event. The Keycloak subject stays on the erased row as an erasure tombstone (an opaque IdP id, no
        personal data) so the same login is a 401 everywhere afterwards instead of silently creating a new
        account; the Keycloak user itself is deleted by a separate job. Only this store's row is erased: a
        customer of several brands of the same organization deletes each account separately (owner decision
        pending). Replaying the call on an already erased account is a 202 no-op.
      security:
        - publishableKey: []
          customerToken: []
      responses:
        '202': { description: Erasure done (or already done) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }

  /store/customers/me/addresses:
    get:
      tags: [customers]
      operationId: listMyAddresses
      security:
        - publishableKey: []
          customerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerAddress' }
              example:
                items:
                  - id: 30000000-0000-4000-8000-000000000601
                    first_name: Jane
                    last_name: Doe
                    company: null
                    line1: Keizersgracht 1
                    line2: null
                    city: Amsterdam
                    region: null
                    postal_code: 1015 CC
                    country: NL
                    phone: null
                    is_default_shipping: true
                    is_default_billing: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }
    post:
      tags: [customers]
      operationId: addMyAddress
      description: |
        The first address a customer adds becomes the default for shipping and billing; later ones are
        neither unless the body says so. `is_default_shipping` / `is_default_billing` set that flag on the
        new address and clear it on the customer's others, in one transaction. At most 50 addresses per
        customer (the 51st is a 400). `updateMyAddress` changes one, `deleteMyAddress` removes one.
      security:
        - publishableKey: []
          customerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Address'
                - type: object
                  properties:
                    is_default_shipping:
                      type: boolean
                      description: >-
                        No schema default on purpose: absent on the customer's first address means default,
                        absent on a later one means not default.
                    is_default_billing:
                      type: boolean
                      description: Same rule as `is_default_shipping`.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAddress' }
              example:
                id: 30000000-0000-4000-8000-000000000601
                first_name: Jane
                last_name: Doe
                company: null
                line1: Keizersgracht 1
                line2: null
                city: Amsterdam
                region: null
                postal_code: 1015 CC
                country: NL
                phone: null
                is_default_shipping: true
                is_default_billing: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }

  /store/customers/me/addresses/{addressId}:
    parameters:
      - { $ref: '#/components/parameters/AddressId' }
    patch:
      tags: [customers]
      operationId: updateMyAddress
      description: |
        Changes one of the customer's addresses. Every field is optional; a present field replaces the stored
        one (`company`, `line2`, `region`, `phone` accept `null`; a required address field cannot be blanked —
        400 naming the field). `is_default_shipping` / `is_default_billing` `true` makes this address the
        default and clears the flag on the customer's others, in one transaction; `false` hands the flag to
        the customer's OLDEST OTHER address — on the customer's only address it is ignored (a customer with
        addresses always has a default). An address of another customer, an unknown id and a malformed id are
        the same 404.
      security:
        - publishableKey: []
          customerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                company: { type: [string, 'null'] }
                line1: { type: string }
                line2: { type: [string, 'null'] }
                city: { type: string }
                region: { type: [string, 'null'] }
                postal_code: { type: string }
                country: { type: string, pattern: '^[A-Z]{2}$' }
                phone: { type: [string, 'null'] }
                is_default_shipping: { type: boolean }
                is_default_billing: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAddress' }
              example:
                id: 30000000-0000-4000-8000-000000000601
                first_name: Jane
                last_name: Doe
                company: null
                line1: Keizersgracht 2
                line2: null
                city: Amsterdam
                region: null
                postal_code: 1015 CC
                country: NL
                phone: null
                is_default_shipping: true
                is_default_billing: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }
    delete:
      tags: [customers]
      operationId: deleteMyAddress
      description: |
        Removes one of the customer's addresses. When the removed address was the default for shipping or
        billing, the customer's OLDEST remaining address takes that flag (a customer with addresses always has
        a default; none left means no default). Answers the customer's remaining addresses, the
        `listMyAddresses` shape (`items` is empty when none is left), so the client sees where the default
        flags went. An address of another customer, or an unknown id, is a 404.
      security:
        - publishableKey: []
          customerToken: []
      responses:
        '200':
          description: The remaining addresses
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerAddress' }
              example:
                items:
                  - id: 30000000-0000-4000-8000-000000000602
                    first_name: Jane
                    last_name: Doe
                    company: null
                    line1: Prinsengracht 263
                    line2: null
                    city: Amsterdam
                    region: null
                    postal_code: 1016 GV
                    country: NL
                    phone: null
                    is_default_shipping: true
                    is_default_billing: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }

  /store/customers/me/consents:
    get:
      tags: [customers]
      operationId: getMyConsents
      description: |
        The customer's current consent decision per purpose in THIS store — one item per purpose of the closed
        set. `granted` is `null` for a purpose the customer was never asked about (nothing recorded), which is
        distinct from an opt-out (`false`). `marketing_email` is the only purpose until the lawyer review adds
        more (a contract change).
      security:
        - publishableKey: []
          customerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerConsents' }
              example:
                items:
                  - {
                      purpose: marketing_email,
                      granted: true,
                      source: storefront,
                      policy_version: '2026-10',
                      recorded_at: '2026-10-18T10:00:00Z',
                    }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }
    put:
      tags: [customers]
      operationId: putMyConsents
      description: |
        Records the customer's answer for one or more purposes under the privacy-policy version the storefront
        displayed (`policy_version`, required — the version the customer saw, not the store's current one).
        One ledger row per purpose whose answer CHANGES; an unchanged answer writes nothing; the current state
        (`GET`) is rewritten in the same transaction. A first explicit `false` IS recorded (a refusal is a
        decision). An unknown purpose, a blank `policy_version` or an empty `consents` list is a 400 naming the
        field.
      security:
        - publishableKey: []
          customerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_version, consents]
              properties:
                policy_version: { type: string, minLength: 1 }
                consents:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [purpose, granted]
                    properties:
                      purpose: { type: string, enum: [marketing_email] }
                      granted: { type: boolean }
      responses:
        '200':
          description: The current state after the answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerConsents' }
              example:
                items:
                  - {
                      purpose: marketing_email,
                      granted: false,
                      source: storefront,
                      policy_version: '2026-10',
                      recorded_at: '2026-10-18T10:05:00Z',
                    }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }

  /store/customers/me/export:
    post:
      tags: [customers]
      operationId: requestMyExport
      summary: Request a copy of my data (GDPR export)
      description: |
        Records the request: one `customer.export_requested` event (v2, `requested_by_type: customer`), ids
        only. The bundle is built and delivered by the core's export job; the customer is told by email when
        it is ready. Every call is its own request (no dedupe).
      security:
        - publishableKey: []
          customerToken: []
      responses:
        '202': { description: Export requested }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }

  /store/customers/me/exports:
    get:
      tags: [customers]
      operationId: listMyExports
      description: |
        The customer's export requests in THIS store, newest first: status `pending` (being built), `ready`
        (downloadable until `expires_at`) or `expired` (purged after 30 days, or never built — `reason`
        `customer_gone` / `too_large`). Ids, timestamps and sizes only; the bundle is `getMyExport`.
      security:
        - publishableKey: []
          customerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerExportSummary' }
              example:
                items:
                  - {
                      id: 30000000-0000-4000-8000-000000000e01,
                      status: ready,
                      requested_at: '2026-10-18T10:00:00Z',
                      ready_at: '2026-10-18T10:05:00Z',
                      expires_at: '2026-11-17T10:05:00Z',
                      size_bytes: 4096,
                      reason: null,
                    }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }

  /store/customers/me/exports/{exportId}:
    parameters:
      - { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [customers]
      operationId: getMyExport
      description: |
        Downloads the bundle (`customer-export/v1`, `application/json`, sent as an attachment) of one of the
        customer's own ready exports. Another customer's export, an unknown id and a malformed id are the same
        404; a pending export is a 404 too (nothing to download yet); an expired or purged export is a 410
        `expired`.
      security:
        - publishableKey: []
          customerToken: []
      responses:
        '200':
          description: The bundle
          headers:
            Content-Disposition:
              {
                schema: { type: string },
                description: 'attachment; filename="customer-export-<id>.json"',
              }
          content:
            application/json:
              schema:
                {
                  type: object,
                  additionalProperties: true,
                  description: 'customer-export/v1 (apps/core/src/modules/customers/README.md "Erasure and export")',
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }
        '410': { $ref: '#/components/responses/Gone' }

  /store/customers/me/orders:
    get:
      tags: [customers, orders]
      operationId: listMyOrders
      security:
        - publishableKey: []
          customerToken: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }
              example:
                page: 1
                limit: 20
                total: 1
                items:
                  - {
                      id: 30000000-0000-4000-8000-000000000501,
                      display_id: 1000,
                      status: confirmed,
                      payment_status: captured,
                      fulfillment_status: unfulfilled,
                      total: { amount_minor: 2918, currency: EUR },
                      placed_at: '2026-09-04T10:00:00Z',
                    }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: >-
            The token's email already belongs to another customer row of this store that cannot be adopted
            (the token's email is not verified, or the row is bound to a different identity) — `conflict`.
            Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: conflict, message: This email already has an account, details: {} }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: X-Publishable-Key
    customerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak customers realm token

  parameters:
    CartId:
      name: cartId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AddressId:
      name: addressId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
    Currency:
      name: currency
      in: query
      description: |
        Prices in this currency; must be one of the store's currencies (GET /store lists them);
        400 validation_error otherwise; default = the store's default currency.
      schema: { type: string, pattern: '^[A-Z]{3}$' }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            { code: validation_error, message: quantity must be >= 1, details: { field: quantity } }
    Unauthorized:
      description: Missing or invalid publishable key / token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: unauthorized, message: Missing X-Publishable-Key, details: {} }
    NotFound:
      description: Not found in this store
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: not_found, message: Not found, details: {} }
    Conflict:
      description: The request conflicts with the current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: conflict, message: Conflict, details: {} }
    Gone:
      description: The export has expired or was purged — `expired`; `details.expires_at` says when
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              code: expired,
              message: This export has expired,
              details: { expires_at: '2026-11-17T10:00:00Z' },
            }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          {
            type: string,
            description: 'Stable machine code: validation_error, unauthorized, forbidden, not_found, out_of_stock, payment_failed, cart_completed, price_changed, conflict, expired, internal',
          }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    Page:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, description: Minor units (cents) }
        currency: { type: string, pattern: '^[A-Z]{3}$' }

    Address:
      type: object
      required: [first_name, last_name, line1, city, postal_code, country]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        company: { type: [string, 'null'] }
        line1: { type: string }
        line2: { type: [string, 'null'] }
        city: { type: string }
        region: { type: [string, 'null'] }
        postal_code: { type: string }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        phone: { type: [string, 'null'] }

    Store:
      type: object
      required:
        [
          id,
          code,
          name,
          default_currency,
          default_locale,
          default_country,
          currencies,
          locales,
          sales_channel,
          theme,
        ]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        default_currency: { type: string }
        default_locale: { type: string }
        default_country: { type: string }
        currencies: { type: array, items: { type: string } }
        locales: { type: array, items: { type: string } }
        sales_channel:
          type: object
          required: [id, code, type]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            type: { type: string, enum: [web, app, marketplace, pos] }
        content_space_id: { type: [string, 'null'] }
        search_index: { type: [string, 'null'] }
        payment:
          type: object
          required: [methods]
          description: >-
            Payment methods the checkout may offer: `card` when the store has a Stripe key configured, `invoice`
            (the manual provider) when the store setting `settings.payment.invoice_allowed` is true (default false
            in production, true in the seed). Derived by the core (#350/#358). Absent = the storefront's own
            default. Optional until the core returns it.
          properties:
            methods:
              type: array
              uniqueItems: true
              items: { type: string, enum: [card, invoice] }
        theme:
          type: object
          additionalProperties: true
          description: >-
            Token overrides for @platform/ui (`BrandTokens`). Each key is a token group — color, font, fontSize,
            fontWeight, lineHeight, spacing, radius, shadow — mapping token name to a CSS value string, e.g.
            `{ color: { primary: "#1E40AF", primaryForeground: "#ffffff" } }`. Unknown groups, unknown keys and
            non-string values are ignored by the storefront.

    Review:
      type: object
      required: [id, rating, title, body, author, created_at, verified_purchase]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: [string, 'null'] }
        body: { type: [string, 'null'] }
        # A display name only, provided or chosen by the customer AT REVIEW TIME — never an email,
        # and never a name derived from the account (CONTRACT CHANGE #270, manager constraint):
        # reviews are public, and this is the field that leaks PII if it carries an identity.
        author: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        verified_purchase: { type: boolean }

    ReviewSummary:
      type: object
      required: [count, average]
      properties:
        count: { type: integer, minimum: 0 }
        # null when count is 0 — never 0, which a shopper reads as "rated zero out of five".
        average: { type: [number, 'null'], minimum: 1, maximum: 5 }

    ReviewPage:
      type: object
      required: [items, total, page, limit, summary]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Review' } }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        summary: { $ref: '#/components/schemas/ReviewSummary' }

    Category:
      type: object
      required: [id, handle, name, parent_id, position]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        name: { type: string }
        parent_id: { type: [string, 'null'], format: uuid }
        position: { type: integer }

    ProductSummary:
      type: object
      required: [id, handle, title, thumbnail_url, price, compare_at_price, category_handle, tags]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        title: { type: string }
        thumbnail_url: { type: [string, 'null'] }
        price:
          {
            $ref: '#/components/schemas/Money',
            description: Lowest variant price in the cart currency,
          }
        compare_at_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        category_handle: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }

    Product:
      type: object
      required:
        [
          id,
          handle,
          title,
          subtitle,
          description,
          status,
          category,
          brand_name,
          tags,
          attributes,
          seo,
          options,
          variants,
          media,
        ]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        description: { type: [string, 'null'], description: Markdown }
        status: { type: string, enum: [published] }
        category:
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        brand_name: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        attributes: { type: object, additionalProperties: true }
        seo:
          type: object
          properties:
            title: { type: string }
            description: { type: string }
            canonical: { type: string }
        # Present so a PDP can render a rating without a second request. The full list is paged
        # through `listProductReviews`; omit the field entirely when the store has no reviews
        # feature, which is different from a store that has it and has none yet.
        review_summary:
          oneOf:
            - $ref: '#/components/schemas/ReviewSummary'
            - type: 'null'
        options:
          type: array
          items:
            type: object
            required: [name, values]
            properties:
              name: { type: string }
              values: { type: array, items: { type: string } }
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }
        media:
          type: array
          items:
            type: object
            required: [url, alt, position, variant_id]
            properties:
              url: { type: string }
              alt: { type: [string, 'null'] }
              position: { type: integer }
              variant_id: { type: [string, 'null'], format: uuid }

    Variant:
      type: object
      required:
        [
          id,
          sku,
          title,
          options,
          price,
          compare_at_price,
          in_stock,
          available_quantity,
          allow_backorder,
        ]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        title: { type: string }
        options: { type: object, additionalProperties: { type: string } }
        price: { $ref: '#/components/schemas/Money' }
        compare_at_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        in_stock: { type: boolean }
        available_quantity:
          { type: [integer, 'null'], description: null when inventory is not managed }
        allow_backorder: { type: boolean }
        weight_g: { type: [integer, 'null'] }

    LineItem:
      type: object
      required:
        [
          id,
          variant_id,
          sku,
          title,
          variant_title,
          thumbnail_url,
          quantity,
          unit_price,
          subtotal,
          discount,
          tax,
          total,
        ]
      properties:
        id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        sku: { type: string }
        title: { type: string }
        variant_title: { type: string }
        thumbnail_url: { type: [string, 'null'] }
        quantity: { type: integer }
        unit_price: { $ref: '#/components/schemas/Money' }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }

    Totals:
      type: object
      required: [subtotal, discount, shipping, tax, total]
      properties:
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        shipping: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }

    ShippingOption:
      type: object
      required: [id, code, name, carrier, price]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        carrier: { type: string }
        price: { $ref: '#/components/schemas/Money' }

    PaymentSession:
      type: object
      required: [provider, session_id, client_secret, status, amount]
      properties:
        provider: { type: string, enum: [stripe, manual] }
        session_id: { type: string }
        client_secret: { type: [string, 'null'], description: For hosted fields; null for manual }
        status: { type: string, enum: [pending, authorized, failed] }
        amount: { $ref: '#/components/schemas/Money' }

    Cart:
      type: object
      required:
        [
          id,
          status,
          currency,
          locale,
          country,
          email,
          items,
          shipping_address,
          billing_address,
          shipping_option,
          promotion_codes,
          payment_session,
          totals,
          order_id,
        ]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, completed, abandoned] }
        currency: { type: string }
        locale: { type: string }
        country: { type: string }
        email: { type: [string, 'null'] }
        items:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
        shipping_address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
        billing_address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
        shipping_option:
          oneOf:
            - $ref: '#/components/schemas/ShippingOption'
            - type: 'null'
        promotion_codes: { type: array, items: { type: string } }
        payment_session:
          oneOf:
            - $ref: '#/components/schemas/PaymentSession'
            - type: 'null'
        totals: { $ref: '#/components/schemas/Totals' }
        order_id: { type: [string, 'null'], format: uuid }
        metadata:
          type: object
          additionalProperties: true
          description: >-
            Free-form, storefront-owned. Written at createCart/updateCart and copied to
            order.metadata at placement. No PII. The storefront writes `attribution`
            (first and last marketing touch); see apps/storefront-starter README and
            docs/marketing-scope.md.

    OrderSummary:
      type: object
      required: [id, display_id, status, payment_status, fulfillment_status, total, placed_at]
      properties:
        id: { type: string, format: uuid }
        display_id: { type: integer }
        status: { type: string, enum: [pending, confirmed, processing, completed, cancelled] }
        payment_status:
          {
            type: string,
            enum: [awaiting, authorized, captured, partially_refunded, refunded, failed, voided],
          }
        fulfillment_status:
          {
            type: string,
            enum: [unfulfilled, partially_fulfilled, fulfilled, partially_returned, returned],
          }
        total: { $ref: '#/components/schemas/Money' }
        placed_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
          description: Copied from cart.metadata when the order is placed.

    Order:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required:
            [
              email,
              currency,
              items,
              shipping_address,
              billing_address,
              shipping_method,
              totals,
              shipments,
            ]
          properties:
            email: { type: string }
            currency: { type: string }
            items:
              type: array
              items: { $ref: '#/components/schemas/LineItem' }
            shipping_address: { $ref: '#/components/schemas/Address' }
            billing_address: { $ref: '#/components/schemas/Address' }
            shipping_method: { $ref: '#/components/schemas/ShippingOption' }
            totals: { $ref: '#/components/schemas/Totals' }
            shipments:
              type: array
              items:
                type: object
                required: [id, status, carrier, tracking_number, tracking_url, shipped_at]
                properties:
                  id: { type: string, format: uuid }
                  status:
                    {
                      type: string,
                      enum:
                        [
                          pending,
                          picking,
                          packed,
                          label_created,
                          shipped,
                          in_transit,
                          delivered,
                          failed,
                          cancelled,
                        ],
                    }
                  carrier: { type: string }
                  tracking_number: { type: [string, 'null'] }
                  tracking_url: { type: [string, 'null'] }
                  shipped_at: { type: [string, 'null'], format: date-time }

    Customer:
      type: object
      required: [id, email, first_name, last_name, phone, status, marketing_consent]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: [string, 'null'] }
        last_name: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        status: { type: string, enum: [guest, registered, disabled] }
        marketing_consent: { type: boolean }

    CustomerAddress:
      allOf:
        - $ref: '#/components/schemas/Address'
        - type: object
          required: [id, is_default_shipping, is_default_billing]
          properties:
            id: { type: string, format: uuid }
            is_default_shipping: { type: boolean }
            is_default_billing: { type: boolean }

    CustomerConsent:
      type: object
      required: [purpose, granted, source, policy_version, recorded_at]
      properties:
        purpose: { type: string, enum: [marketing_email] }
        granted:
          type: [boolean, 'null']
          description: null = never asked (no decision recorded); false = refused / opted out.
        source: { type: [string, 'null'], enum: [storefront, admin, import, null] }
        policy_version: { type: [string, 'null'] }
        recorded_at: { type: [string, 'null'], format: date-time }
    CustomerConsents:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerConsent' }
    CustomerExportSummary:
      type: object
      required: [id, status, requested_at, ready_at, expires_at, size_bytes, reason]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, ready, expired] }
        requested_at: { type: string, format: date-time }
        ready_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        size_bytes:
          {
            type: [integer, 'null'],
            description: compressed size of the bundle; null until ready or after purge,
          }
        reason: { type: [string, 'null'], enum: [customer_gone, too_large, null] }

