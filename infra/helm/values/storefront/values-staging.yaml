# storefront in staging. See infra/README.md "Helm" for how these files are used.
#
# Nothing secret belongs here: credentials reach the pod through the ExternalSecret below,
# which names a key in AWS Secrets Manager and never carries a value. Hostnames use the same
# <sub>.<env>.example.com placeholder as ingress.host and are substituted by the deploy.

image:
  # From the terraform output `ecr_repository_urls`. The account id differs per
  # environment, so the deploy workflow overrides this with --set rather than
  # committing an account number.
  repository: REPLACED_BY_DEPLOY/staging/commerce-platform/storefront
  # A git sha, always. The placeholder is what `helm template` renders in CI; the chart
  # refuses `latest`, because a moving tag means the cluster and the repo disagree.
  tag: '0000000000000000000000000000000000000000'

replicaCount: 2

service:
  port: 80
  targetPort: 3100
  healthPath: /health

ingress:
  enabled: true
  className: alb
  host: shop.staging.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Non-secret configuration, names exactly as in .env.example. Without this an app falls
# back to its localhost defaults, which inside a pod means itself.
env:
  KEYCLOAK_URL: 'https://auth.staging.example.com'
  KEYCLOAK_REALM_STAFF: 'staff'
  KEYCLOAK_REALM_CUSTOMERS: 'customers'
  STORE_API_URL: 'https://api.staging.example.com'
  STORE_PUBLISHABLE_KEY: 'pk_brand-a_dev_00000000000000000000'
  # The storefront's own origin: the OIDC redirect URI, canonicals, hreflang, the sitemap and the
  # robots.txt host. Must be https://<ingress.host> — infra/helm/check.sh fails the build otherwise.
  # Without it the pod sends redirect_uri=http://localhost:3100/auth/callback and sign-in breaks
  # silently (#257).
  SITE_URL: 'https://shop.staging.example.com'
  # ROBOTS_ALLOW_INDEXING is deliberately absent: unset, /robots.txt says `Disallow: /`. Only a
  # production values file may set it to '1'; check.sh rejects it anywhere else.

externalSecrets:
  enabled: true
  remoteKeys:
    - key: staging/platform/app
