# core in staging. See infra/README.md "Helm" for how these files are used.
#
# Nothing secret belongs here: credentials reach the pod through the ExternalSecret below,
# which names a key in AWS Secrets Manager and never carries a value. Hostnames use the same
# <sub>.<env>.example.com placeholder as ingress.host and are substituted by the deploy.

image:
  # From the terraform output `ecr_repository_urls`. The account id differs per
  # environment, so the deploy workflow overrides this with --set rather than
  # committing an account number.
  repository: REPLACED_BY_DEPLOY/staging/commerce-platform/core
  # A git sha, always. The placeholder is what `helm template` renders in CI; the chart
  # refuses `latest`, because a moving tag means the cluster and the repo disagree.
  tag: '0000000000000000000000000000000000000000'

replicaCount: 2

service:
  port: 80
  targetPort: 9000
  healthPath: /health

ingress:
  enabled: true
  className: alb
  host: api.staging.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Non-secret configuration, names exactly as in .env.example. Without this an app falls
# back to its localhost defaults, which inside a pod means itself.
env:
  KEYCLOAK_URL: 'https://auth.staging.example.com'
  KEYCLOAK_REALM_STAFF: 'staff'
  KEYCLOAK_REALM_CUSTOMERS: 'customers'
  OPENFGA_API_URL: 'https://openfga.staging.example.com'
  OPENFGA_STORE_ID: ''
  MEDUSA_DB_SCHEMA: 'medusa'
  CORE_ORGANIZATION_ID: '00000000-0000-4000-8000-000000000001'
  STORE_CORS: 'https://shop.staging.example.com'
  ADMIN_CORS: 'https://admin.staging.example.com'
  AUTH_CORS: 'https://shop.staging.example.com,https://admin.staging.example.com'
  S3_MEDIA_BUCKET: 'REPLACED_BY_DEPLOY-staging-media'

# Only core owns the schema, so only core runs the migrations. They run as an ArgoCD
# PreSync hook out of this same image, with the OWNER role — which the application
# itself never gets: it connects as platform_app and is subject to RLS.
migrations:
  enabled: true
  ownerSecret:
    remoteKey: staging/platform/database/owner

externalSecrets:
  enabled: true
  remoteKeys:
    - key: staging/platform/database/app
    - key: staging/platform/redis
    - key: staging/platform/app
