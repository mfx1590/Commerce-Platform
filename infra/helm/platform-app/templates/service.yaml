apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-app.name" . }}
  labels: {{- include "platform-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector: {{- include "platform-app.selectorLabels" . | nindent 4 }}
