{{- include "platform-app.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-app.name" . }}
  labels: {{- include "platform-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "platform-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "platform-app.selectorLabels" . | nindent 8 }}
      annotations:
        # Rolls the pods when the CONFIGURATION in git changes. It hashes .Values.env and the list of
        # secret keys — not the secret values, which Helm never sees: they are written into the
        # Secret by External Secrets at run time, long after this is rendered.
        checksum/config: {{ toYaml (dict "env" .Values.env "secrets" .Values.externalSecrets) | sha256sum }}
        {{- if and .Values.externalSecrets.enabled .Values.reloader.enabled }}
        # And this is what covers a ROTATED value. `envFrom` captures env vars when the container
        # starts; Kubernetes does not restart anything when a Secret's contents change, so without a
        # watcher a rotated credential sits in the Secret while every running pod keeps the old one —
        # until something unrelated happens to restart them. Reloader watches the Secrets a
        # Deployment references and triggers a rollout. It is a cluster add-on (see the bootstrap
        # runbook); `kubectl rollout restart` is the manual equivalent if it is not installed.
        reloader.stakater.com/auto: 'true'
        {{- end }}
    spec:
      serviceAccountName: {{ include "platform-app.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: {{ include "platform-app.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            # The image reads $PORT; keep the container and the Service in step from one value.
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.externalSecrets.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "platform-app.secretName" . }}
          {{- end }}
          # Three probes, because they answer three different questions. Startup covers a slow first
          # boot (Medusa runs migrations checks) without making the liveness timeout generous
          # forever; readiness takes a pod out of the Service while it is busy; liveness restarts it
          # only when it is genuinely wedged.
          startupProbe:
            {{- include "platform-app.probeAction" . | nindent 12 }}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            {{- include "platform-app.probeAction" . | nindent 12 }}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            {{- include "platform-app.probeAction" . | nindent 12 }}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts: {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
