{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.remoteKeys }}
{{- fail "externalSecrets.enabled is true but no remoteKeys were given — an app with no secrets should set externalSecrets.enabled=false rather than project an empty Secret" }}
{{- end }}
# The only way a credential reaches a pod. Terraform generates every secret and stores it in AWS
# Secrets Manager (task 2.2); External Secrets Operator projects it into a Kubernetes Secret; the
# Deployment consumes that with envFrom. Nothing sensitive is in git, in a values file, or in the
# rendered manifest — this object names a remote key, it does not carry a value.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "platform-app.name" . }}
  labels: {{- include "platform-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ include "platform-app.secretName" . }}
    creationPolicy: Owner
  dataFrom:
    {{- range .Values.externalSecrets.remoteKeys }}
    - extract:
        key: {{ .key | quote }}
    {{- end }}
{{- end }}
