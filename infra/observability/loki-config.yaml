# Single-binary Loki for local development: filesystem storage, no clustering, no retention worth
# the name. Staging and production use Grafana Cloud (the managed-first decision), so this file is
# deliberately not a template for either.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP log ingestion is what the collector sends.
  allow_structured_metadata: true
  reject_old_samples: false

ruler:
  alertmanager_url: http://localhost:9093
