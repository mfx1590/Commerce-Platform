# Single-binary Tempo for local development. Receives OTLP from the collector only — apps never talk
# to it directly, so there is one place to change if traces move to Grafana Cloud.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h # local disk; a day of traces is plenty to debug with

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Turns trace data into RED metrics (rate, errors, duration) that Prometheus can scrape, which is
# what makes the request-rate and p95 panels work before anyone writes a single custom metric.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
      processor:
        span_metrics:
          # Without this the generated series carry only service/span_name/span_kind/status_code,
          # and every per-store panel renders empty — the dimension this platform is sliced by is a
          # resource attribute, and span-metrics promotes nothing by default. Verified by sending a
          # span and reading the label set back out of Prometheus.
          dimensions:
            - store_id
            - deployment.environment
