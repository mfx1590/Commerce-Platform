# Dashboards are files in this repository, not objects in Grafana's database. Editing one in the UI
# is fine for exploring; keeping it means exporting the JSON back into infra/observability.
apiVersion: 1

providers:
  - name: commerce-platform
    orgId: 1
    folder: Commerce platform
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
