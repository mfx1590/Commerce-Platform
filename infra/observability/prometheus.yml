# Scrapes the collector, not the apps. One target that is always up beats N targets that come and go
# with every `pnpm dev` restart.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# The SLO recording and burn-rate alert rules (#730), generated by rules/slo.mjs. Relative to this file, so the
# same line works in the container (/etc/prometheus/rules) and in infra/observability/check.sh (/cfg/rules).
rule_files:
  - rules/slo.rules.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
