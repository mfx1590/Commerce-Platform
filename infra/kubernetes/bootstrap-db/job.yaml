# Creates the `platform_app` database role with the password Terraform generated, before the
# migrations run. Wired as an ArgoCD PreSync hook in task 2.3, so it runs on every sync and is a
# no-op when the role already has the right password.
#
# It reads two Kubernetes secrets that External Secrets Operator projects from AWS Secrets Manager
# (task 2.6) — `platform-database-owner` and `platform-database-app`. No credential is ever inlined
# here, and the Job never logs one: psql gets the password through PGPASSWORD and a psql variable.
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-db
  labels:
    app.kubernetes.io/name: bootstrap-db
    app.kubernetes.io/part-of: commerce-platform
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap-db
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # the postgres user in the postgres:16-alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - psql
            - --no-psqlrc
            - --set=ON_ERROR_STOP=1
            - --set=app_username=$(APP_USERNAME)
            - --set=app_password=$(APP_PASSWORD)
            - --file=/sql/bootstrap.sql
          env:
            # Owner/master connection — the only role allowed to create other roles.
            - name: PGHOST
              valueFrom:
                secretKeyRef: { name: platform-database-owner, key: host }
            - name: PGPORT
              valueFrom:
                secretKeyRef: { name: platform-database-owner, key: port }
            - name: PGDATABASE
              valueFrom:
                secretKeyRef: { name: platform-database-owner, key: database }
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: platform-database-owner, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: platform-database-owner, key: password }
            - name: PGSSLMODE
              value: require # the RDS parameter group sets rds.force_ssl = 1
            # The role this Job creates.
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef: { name: platform-database-app, key: username }
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: platform-database-app, key: password }
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: sql
          configMap:
            name: bootstrap-db-sql
