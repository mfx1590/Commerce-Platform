# The single place the cluster is allowed to read secrets from.
#
# Cluster-scoped, so it is a bootstrap step and not something a sync may create — the AppProject in
# infra/argocd forbids cluster-scoped kinds deliberately (an app-of-apps otherwise puts unrestricted
# cluster access one commit away).
#
# Authentication is IRSA: the operator's service account is annotated with the role Terraform
# creates (`terraform output external_secrets_role_arn`), which can read `<env>/platform/*` and
# `<env>/stores/*` in this environment only, read-only. There is no access key anywhere.
#
#   kubectl apply -f infra/kubernetes/external-secrets/cluster-secret-store.yaml
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      # Replaced by the deploy/bootstrap with the environment's region.
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
