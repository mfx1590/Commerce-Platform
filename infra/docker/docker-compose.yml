# Local stack for `pnpm dev` (main window, Phase 0). Credentials here are local-only defaults, mirrored in .env.example.
# Host ports avoid the usual defaults where another project may already own them (Postgres 5433, Redis 6381, Keycloak 8180).
name: commerce-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform -d platform']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
    ports:
      - '19092:19092' # Kafka API (KAFKA_BROKERS=localhost:19092)
      - '18081:18081' # Schema registry
      - '18082:18082' # HTTP proxy
      - '9644:9644' # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -E "Healthy:.+true" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm', '--http-port=8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: dev-file # persisted in the keycloak-data volume; realms imported once, then kept
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_MANAGEMENT_PORT: '9000'
    ports:
      - '8180:8080'
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n" >&3 && grep -q "UP" <&3',
        ]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  openfga:
    image: openfga/openfga:v1.8.4
    command: ['run']
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_HTTP_ADDR: 0.0.0.0:8080
      OPENFGA_GRPC_ADDR: 0.0.0.0:8081
      OPENFGA_PLAYGROUND_ENABLED: 'true'
      OPENFGA_PLAYGROUND_PORT: '3000'
      OPENFGA_LOG_FORMAT: text
    ports:
      - '8081:8080' # HTTP API (OPENFGA_API_URL=http://localhost:8081)
      - '8082:8081' # gRPC
      # Playground. Host port 18083, not 3001: on a Windows machine whose dynamic port range starts at
      # 1024, WinNAT reserves random 100-port blocks below 15000 and moves them on every restart. 3001
      # landed in one (2917-3016) and compose refused to start the container at all. Above 15000 those
      # blocks cannot land, and it sits next to Redpanda's 18081/18082 which are safe for the same reason.
      - '18083:3000'
    healthcheck:
      test: ['CMD', '/openfga', 'version']
      interval: 10s
      timeout: 5s
      retries: 10

  mock-store:
    image: stoplight/prism:5
    command: [
        'mock',
        '--host',
        '0.0.0.0',
        '--port',
        '4010',
        '--errors',
        '--no-multiprocess',
        '/specs/store-api.yaml',
      ] # --no-multiprocess: Prism 5.15 image crashes on cluster.isPrimary
    ports:
      - '4010:4010'
    volumes:
      - ../../packages/contracts/openapi:/specs:ro

  mock-admin:
    image: stoplight/prism:5
    command:
      [
        'mock',
        '--host',
        '0.0.0.0',
        '--port',
        '4011',
        '--errors',
        '--no-multiprocess',
        '/specs/admin-api.yaml',
      ]
    ports:
      - '4011:4011'
    volumes:
      - ../../packages/contracts/openapi:/specs:ro

  # ---------------------------------------------------------------------------------------------
  # Observability. All five carry `profiles: [observability]`, so `pnpm dev` and a plain
  # `docker compose up` do not start them: they cost nothing until you ask for them with
  #
  #     docker compose -f infra/docker/docker-compose.yml --profile observability up -d
  #
  # Ports were picked against `Get-NetTCPConnection`, not from the defaults: Grafana's own 3000 is
  # held by an unrelated project on this machine, Loki's 3100 is the storefront, and Tempo's 3200 is
  # the admin end-to-end port. The collector keeps 4317/4318 because every OpenTelemetry SDK ships
  # pointing at them — remapping those would push configuration into every app.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    profiles: ['observability']
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ../observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC — OTEL_EXPORTER_OTLP_ENDPOINT
      - '4318:4318' # OTLP HTTP
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: ['observability']
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=24h'
      # Tempo's metrics-generator remote-writes the span metrics the dashboards read.
      - '--web.enable-remote-write-receiver'
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'

  loki:
    image: grafana/loki:3.3.2
    profiles: ['observability']
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ../observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - '3410:3100' # 3100 in the container is Loki's default; 3100 on the host is the storefront

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ['observability']
    command: ['-config.file=/etc/tempo/config.yaml']
    volumes:
      - ../observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - '3420:3200' # 3200 in the container is Tempo's default; 3200 on the host is the admin e2e port

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ['observability']
    environment:
      # Local only: this is a laptop dashboard, not an exposed service. Nothing here is a secret.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      # The read-only metrics role from migration 0110. Overridable so the same provisioning file
      # works against a cloud database.
      POSTGRES_METRICS_PASSWORD: ${POSTGRES_METRICS_PASSWORD:-platform_metrics}
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3400:3000' # 3000 on this machine belongs to an unrelated project
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres-data:
  redpanda-data:
  keycloak-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
