# gitleaks configuration for the CI secret scan.
#
# Lives here rather than at the repository root because root config belongs to the main window
# (docs/ownership.md). `.github/workflows/ci.yml` points at it with GITLEAKS_CONFIG.
#
# Every default rule stays on — this file only adds allowlists, and each one says why it is safe.
# The bar for adding an entry: the match must be provably not a credential, and the entry must be
# narrow enough that a real credential in the same place would still be caught.

[extend]
useDefault = true

[allowlist]
description = "Paths and strings that cannot be credentials"

paths = [
  # Build output. Not in git, so CI never sees it, but a local `gitleaks dir .` otherwise reports
  # dozens of minified-bundle false positives and nobody runs the scan twice after that.
  '''(^|/)\.next/''',
  '''(^|/)\.medusa/''',
  '''(^|/)dist/''',
  '''(^|/)\.turbo/''',
  '''(^|/)node_modules/''',
  '''(^|/)test-results/''',
  '''(^|/)playwright-report/''',
  '''(^|/)\.terraform/''',
]

regexes = [
  # Local-development defaults. Every one of these is in .env.example, in a docker-compose file or
  # in a migration as the well-known local value; the cloud equivalents are generated by Terraform
  # into Secrets Manager and never appear in git. Listing them explicitly means a NEW secret-shaped
  # string still fails the scan.
  '''platform_app''',
  '''platform_metrics''',
  '''medusa_owner''',
  '''dev-only-[a-z-]+''',
  '''pk_brand-[a-c]_dev_0+''',
  '''build-time-placeholder''',
  '''REPLACED_BY_DEPLOY''',
  # The all-zero placeholder image tag the charts render in CI.
  '''0{40}''',

  # gitleaks' `generic-api-key` is a heuristic, and it matches English prose in the changelogs:
  # "…support/store_admin/owner keep access, analyst/finance/operations lose it" reads like an
  # assignment to it. Allowlisting the shape rather than the file keeps every rule — including the
  # specific ones for AWS, GitHub, Stripe and private keys — active on those same files.
  # The allowlist regex is matched against the extracted SECRET, which is narrower than the reported
  # MATCH: here the match is "access, analyst/finance/operations " but the secret is just
  # "analyst/finance/operations". Anchoring on the match silently allowlists nothing — worth
  # checking the `Secret` field of a JSON report rather than the human-readable output.
  '''^analyst/finance/operations$''',

  # Test-only idempotency keys in apps/core/src/modules/payments/payments.test.ts (window 7, PR #183):
  # 'placement-key-12345678' and friends are the literal strings a test sends as an Idempotency-Key so
  # the assertions can name them. They trip `generic-api-key` on entropy alone. Anchored to the exact
  # four literals, so any other secret-shaped string in that file still fails. Added by the manager
  # 2026-09-08: the scan covers every branch's history, so one such literal reddens every PR at once.
  '''^(placement-key|refund-key|refund-fail|refund-unknown)-12345678$''',
]
