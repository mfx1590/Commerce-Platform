# PROPOSED Admin API additions for reporting v1 (#479, window 12; manager decisions 2026-10-18). Not a complete
# OpenAPI document: the main window merges `tags`, `paths` and `components.schemas` below into
# packages/contracts/openapi/admin-api.yaml (Admin API 0.4.18, or the next patch if #489 lands first) and runs
# `pnpm --filter @platform/contracts generate`. Every response reads the 0200 reporting views through the
# tenant-scoped client; amounts are integer minor units and are never summed across currencies.
tags:
  - name: reports

paths:
  /admin/stores/{storeId}/reports/sales:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [reports]
      operationId: getStoreSalesReport
      summary: Daily sales of one store per currency (rpt_sales_daily)
      description: |
        One row per UTC day and currency over `[from, to)`. Orders that are cancelled, or whose payment is voided or
        failed, are not sales; `awaiting` orders are. `net_minor` is cohort-attributed: total minus the succeeded
        refunds of the orders placed that day, whenever the refund happened. Amounts are never summed across
        currencies: `totals` has one entry per currency.
      x-permission: { relation: viewer, object: 'store:{storeId}' }
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportCurrency' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }
              example:
                from: '2026-03-01'
                to: '2026-03-02'
                generated_at: '2026-03-10T09:00:00Z'
                rows:
                  - store_id: 00000000-0000-4000-8000-000000000031
                    day: '2026-03-01'
                    currency: EUR
                    orders: 2
                    gross_minor: 12000
                    discount_minor: 100
                    shipping_minor: 200
                    tax_minor: 100
                    total_minor: 12200
                    refunded_minor: 2500
                    net_minor: 9700
                totals:
                  - store_id: 00000000-0000-4000-8000-000000000031
                    currency: EUR
                    orders: 2
                    gross_minor: 12000
                    discount_minor: 100
                    shipping_minor: 200
                    tax_minor: 100
                    total_minor: 12200
                    refunded_minor: 2500
                    net_minor: 9700
                currency_totals:
                  - currency: EUR
                    orders: 2
                    gross_minor: 12000
                    discount_minor: 100
                    shipping_minor: 200
                    tax_minor: 100
                    total_minor: 12200
                    refunded_minor: 2500
                    net_minor: 9700
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/stores/{storeId}/reports/stock:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [reports]
      operationId: getStoreStockReport
      summary: Stock position of the pool rows this store sells from (rpt_stock_position)
      description: |
        The current position (no date range) of every pool row whose stock item one of this store's variants maps,
        ordered by `sku`, then `warehouse_code`. On a shared item `reserved` is held by every store that maps it.
      x-permission: { relation: viewer, object: 'store:{storeId}' }
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockReport' }
              example:
                page: 1
                limit: 20
                total: 1
                generated_at: '2026-03-10T09:00:00Z'
                items:
                  - stock_item_id: 00000000-0000-4000-8000-000000000051
                    sku: shared-tee-m
                    warehouse_id: 00000000-0000-4000-8000-000000000021
                    warehouse_code: wh-eu
                    on_hand: 40
                    reserved: 3
                    incoming: 0
                    available: 37
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/hq/reports/sales:
    get:
      tags: [reports]
      operationId: getHqSalesReport
      summary: Daily sales of every store per currency (rpt_sales_daily, organization scope)
      description: |
        As `getStoreSalesReport`, for every store of the organization: rows per store, day and currency; `totals`
        per store and currency; `currency_totals` per currency across stores. Amounts are never summed across
        currencies.
      x-permission: { relation: analyst, object: 'organization:hq' }
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportCurrency' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }
              example:
                from: '2026-03-01'
                to: '2026-03-02'
                generated_at: '2026-03-10T09:00:00Z'
                rows:
                  - store_id: 00000000-0000-4000-8000-000000000032
                    day: '2026-03-01'
                    currency: GBP
                    orders: 1
                    gross_minor: 5900
                    discount_minor: 50
                    shipping_minor: 100
                    tax_minor: 50
                    total_minor: 6000
                    refunded_minor: 600
                    net_minor: 5400
                totals:
                  - store_id: 00000000-0000-4000-8000-000000000032
                    currency: GBP
                    orders: 1
                    gross_minor: 5900
                    discount_minor: 50
                    shipping_minor: 100
                    tax_minor: 50
                    total_minor: 6000
                    refunded_minor: 600
                    net_minor: 5400
                currency_totals:
                  - currency: GBP
                    orders: 1
                    gross_minor: 5900
                    discount_minor: 50
                    shipping_minor: 100
                    tax_minor: 50
                    total_minor: 6000
                    refunded_minor: 600
                    net_minor: 5400
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/hq/reports/finance:
    get:
      tags: [reports]
      operationId: getHqFinanceReport
      summary: Captured payments, PSP fees and refunds per store and currency (cash view)
      description: |
        Payments captured in `[from, to)` by capture day (rpt_payments_daily) and succeeded refunds by refund day
        (rpt_refunds_daily), per store and currency, plus `currency_totals` per currency across stores. PSP fees are
        the fees known so far and are NOT reconciled (`fees_reconciled` is false until Integration 4);
        `fee_unknown` counts captured payments without a fee yet. Amounts are never summed across currencies. No
        ledger figures in v1.
      x-permission: { relation: finance, object: 'organization:hq' }
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportCurrency' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceReport' }
              example:
                from: '2026-03-01'
                to: '2026-04-01'
                generated_at: '2026-04-02T09:00:00Z'
                fees_reconciled: false
                rows:
                  - store_id: 00000000-0000-4000-8000-000000000031
                    currency: EUR
                    captured_count: 2
                    captured_minor: 14000
                    fee_minor: 290
                    fee_unknown: 1
                    refunds: 1
                    refunded_minor: 2500
                    refunded_by_reason:
                      { return: 0, cancellation: 0, goodwill: 2500, chargeback: 0 }
                currency_totals:
                  - currency: EUR
                    captured_count: 2
                    captured_minor: 14000
                    fee_minor: 290
                    fee_unknown: 1
                    refunds: 1
                    refunded_minor: 2500
                    refunded_by_reason:
                      { return: 0, cancellation: 0, goodwill: 2500, chargeback: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    ReportFrom:
      name: from
      in: query
      required: true
      description: First UTC day of the report, inclusive.
      schema: { type: string, format: date }
    ReportTo:
      name: to
      in: query
      required: true
      description: UTC day after the last day of the report (exclusive); after `from`, at most 366 days later.
      schema: { type: string, format: date }
    ReportCurrency:
      name: currency
      in: query
      required: false
      description: Only rows in this currency.
      schema: { type: string, pattern: '^[A-Z]{3}$' }

  schemas:
    SalesFigures:
      type: object
      description: Integer minor units of one currency. Never a sum across currencies.
      required:
        [
          orders,
          gross_minor,
          discount_minor,
          shipping_minor,
          tax_minor,
          total_minor,
          refunded_minor,
          net_minor,
        ]
      properties:
        orders: { type: integer, minimum: 0 }
        gross_minor: { type: integer, description: sum of order subtotals }
        discount_minor: { type: integer }
        shipping_minor: { type: integer }
        tax_minor: { type: integer }
        total_minor: { type: integer }
        refunded_minor:
          { type: integer, description: succeeded refunds of these orders, whenever refunded }
        net_minor: { type: integer, description: total_minor − refunded_minor }
    SalesReport:
      type: object
      description: |
        Sales from the `rpt_sales_daily` view over `[from, to)` (UTC days). Every amount sits beside its `currency`;
        amounts are never summed across currencies.
      required: [from, to, generated_at, rows, totals, currency_totals]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        rows:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/SalesFigures'
              - type: object
                required: [store_id, day, currency]
                properties:
                  store_id: { type: string, format: uuid }
                  day: { type: string, format: date }
                  currency: { type: string, pattern: '^[A-Z]{3}$' }
        totals:
          type: array
          description: One entry per store and currency.
          items:
            allOf:
              - $ref: '#/components/schemas/SalesFigures'
              - type: object
                required: [store_id, currency]
                properties:
                  store_id: { type: string, format: uuid }
                  currency: { type: string, pattern: '^[A-Z]{3}$' }
        currency_totals:
          type: array
          description: One entry per currency, across the stores in `rows`.
          items:
            allOf:
              - $ref: '#/components/schemas/SalesFigures'
              - type: object
                required: [currency]
                properties:
                  currency: { type: string, pattern: '^[A-Z]{3}$' }
    StockPosition:
      type: object
      required:
        [stock_item_id, sku, warehouse_id, warehouse_code, on_hand, reserved, incoming, available]
      properties:
        stock_item_id: { type: string, format: uuid }
        sku: { type: string }
        warehouse_id: { type: string, format: uuid }
        warehouse_code: { type: string }
        on_hand: { type: integer }
        reserved: { type: integer, description: held by every store that maps the item }
        incoming: { type: integer }
        available: { type: integer, description: on_hand − reserved }
    StockReport:
      description: The pool rows a store sells from (`rpt_stock_position`), now.
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [generated_at, items]
          properties:
            generated_at: { type: string, format: date-time }
            items: { type: array, items: { $ref: '#/components/schemas/StockPosition' } }
    FinanceFigures:
      type: object
      description: Integer minor units of one currency. Never a sum across currencies.
      required:
        [
          captured_count,
          captured_minor,
          fee_minor,
          fee_unknown,
          refunds,
          refunded_minor,
          refunded_by_reason,
        ]
      properties:
        captured_count: { type: integer, minimum: 0 }
        captured_minor: { type: integer }
        fee_minor: { type: integer, description: PSP fees known so far — unreconciled }
        fee_unknown:
          { type: integer, minimum: 0, description: captured payments whose fee is not known yet }
        refunds: { type: integer, minimum: 0 }
        refunded_minor: { type: integer }
        refunded_by_reason:
          type: object
          required: [return, cancellation, goodwill, chargeback]
          properties:
            return: { type: integer }
            cancellation: { type: integer }
            goodwill: { type: integer }
            chargeback: { type: integer }
    FinanceReport:
      type: object
      description: |
        Cash view over `[from, to)` (UTC days): payments by capture day, succeeded refunds by refund day. Every amount
        sits beside its `currency`; amounts are never summed across currencies. Fees are unreconciled
        (`fees_reconciled: false`) until Integration 4.
      required: [from, to, generated_at, fees_reconciled, rows, currency_totals]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        fees_reconciled: { type: boolean, const: false }
        rows:
          type: array
          description: One entry per store and currency.
          items:
            allOf:
              - $ref: '#/components/schemas/FinanceFigures'
              - type: object
                required: [store_id, currency]
                properties:
                  store_id: { type: string, format: uuid }
                  currency: { type: string, pattern: '^[A-Z]{3}$' }
        currency_totals:
          type: array
          description: One entry per currency, across stores.
          items:
            allOf:
              - $ref: '#/components/schemas/FinanceFigures'
              - type: object
                required: [currency]
                properties:
                  currency: { type: string, pattern: '^[A-Z]{3}$' }
