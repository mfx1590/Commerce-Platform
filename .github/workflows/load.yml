name: load

# The #359 load test on a GitHub-hosted runner: infra/load/run.sh, the same script the laptop runs. Never on a pull
# request or a push: a 15-minute run that measures a machine is not a check, it would turn every PR's CI into a
# benchmark of whichever runner it landed on.
#
# Two triggers:
# - workflow_dispatch: a measurement by hand (inputs below).
# - schedule, weekly: the SLO regression (plan wave 3). The target run only (the ramps are measurements, not
#   gates), gated on the SLOs: infra/load/k6/slo-thresholds.js, kept equal to infra/observability/rules/slo.mjs by a
#   self-test. A breach counts only if a second pass breaches too. A scheduled run comments on the tracking issue,
#   and a confirmed breach opens or updates ONE regression issue. A manual run only PRINTS those texts (a dry run).
on:
  schedule:
    - cron: '0 4 * * 1' # Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: 'target run length (k6 duration, e.g. 10m; 1m for a smoke)'
        default: '10m'
      browse_rps:
        description: 'browse requests per second'
        default: '50'
      orders_per_min:
        description: 'orders placed per minute'
        default: '30'
      skip_ramps:
        description: 'skip the two ramps (the app-pool knee and the placement ceiling): the target run only'
        type: boolean
        default: false
      metrics_months:
        description: 'generated months seeded into ClickHouse for the admin-metrics leg (1-12; more data = a less optimistic 300 ms gate)'
        default: '1'
      threshold_factor:
        description: 'scale the SLO latency gates (1 = the SLOs; e.g. 0.05 forces a breach to show the retry and the issue text, as a dry run)'
        default: '1'

permissions:
  contents: read

concurrency:
  group: load
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  load:
    name: load (${{ github.event_name == 'schedule' && 'scheduled SLO regression' || 'manual' }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    env:
      # The schedule has no inputs: the owner's target, the target run only, the SLOs unscaled.
      DURATION: ${{ inputs.duration || '10m' }}
      BROWSE_RPS: ${{ inputs.browse_rps || '50' }}
      ORDERS_PER_MIN: ${{ inputs.orders_per_min || '30' }}
      LOAD_THRESHOLD_FACTOR: ${{ inputs.threshold_factor || '1' }}
      # The admin-metrics leg (#785): k6/metrics.js at 2 req/s next to the target load, against the core's metrics API
      # on a seeded ClickHouse, as the staff realm's dev `analyst` (a real JWT + the OpenFGA check: the production path).
      LOAD_METRICS: '1'
      METRICS_RPS: '2'
      METRICS_STAFF_USER: analyst
      # localhost, NOT 127.0.0.1: the staff realm pins frontendUrl http://localhost:8180, so every token's `iss` is
      # localhost, and the core pins the issuer from this same variable (the first #801 proofs got 401 with 127.0.0.1).
      KEYCLOAK_URL: http://localhost:8180
      # The compose ClickHouse (profile analytics). The admin pair is compose's local word. The read-only and ingest
      # passwords are generated per job and masked (the step below); nothing here is a credential.
      CLICKHOUSE_URL: http://127.0.0.1:18123
      CLICKHOUSE_DATABASE: analytics
      CLICKHOUSE_USER: platform
      CLICKHOUSE_PASSWORD: platform
      CLICKHOUSE_READONLY_USER: analytics_ro
      CLICKHOUSE_INGEST_USER: analytics_ingest
    steps:
      - uses: actions/checkout@v7
      # A typo must fail here, not gate on NaN for 15 minutes (slo-thresholds.js refuses it too).
      - name: threshold_factor is a number > 0
        run: |
          node -e 'const f = Number(process.argv[1]); if (!(Number.isFinite(f) && f > 0)) { console.error(`threshold_factor must be a number > 0, got "${process.argv[1]}"`); process.exit(1); }' "$LOAD_THRESHOLD_FACTOR"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same services as `auth-e2e` in ci.yml. Nothing here needs a secret: the load uses the seeded
      # publishable key on a throwaway database.
      - name: boot postgres, redis, keycloak and openfga
        run: docker compose -f infra/docker/docker-compose.yml up -d postgres redis keycloak openfga
      - name: the stack is really up
        run: bash infra/ci/wait-for-auth-stack.sh
      # ---- the admin-metrics leg (#785): ClickHouse, its schema and users, a seeded month, OpenFGA, a staff user ----
      - name: per-job ClickHouse passwords (masked), never committed
        run: |
          ro="$(openssl rand -hex 24)"
          ingest="$(openssl rand -hex 24)"
          echo "::add-mask::$ro"
          echo "::add-mask::$ingest"
          {
            echo "CLICKHOUSE_READONLY_PASSWORD=$ro"
            echo "CLICKHOUSE_INGEST_PASSWORD=$ingest"
            echo "LOAD_CH_SEED=$RUNNER_TEMP/load/ch-seed.json"
          } >> "$GITHUB_ENV"
      - name: boot ClickHouse and wait for it
        run: |
          docker compose -f infra/docker/docker-compose.yml --profile analytics up -d clickhouse
          for _ in $(seq 60); do curl -sf http://127.0.0.1:18123/ping >/dev/null && exit 0; sleep 2; done
          echo 'ClickHouse did not answer /ping in 120 s'; exit 1
      - name: build the packages the seed imports (the ingest and the generated month)
        run: pnpm turbo run build --filter=@platform/analytics-ingest... --filter=@platform/test-utils...
      - name: ClickHouse schema, models and users (ch:migrate), then one generated month per metrics_months
        # The input reaches the shell as data (env), never interpolated into the script; ch-seed.mjs refuses
        # anything but an integer 1-12 (#801 review).
        env:
          METRICS_MONTHS: ${{ inputs.metrics_months || '1' }}
        run: |
          pnpm --filter @platform/analytics-ingest ch:migrate
          mkdir -p "$RUNNER_TEMP/load"
          node infra/load/ch-seed.mjs "$LOAD_CH_SEED" "$METRICS_MONTHS"
          echo "METRICS_LAST_DAY=$(node -p 'require(process.argv[1]).lastDay' "$LOAD_CH_SEED")" >> "$GITHUB_ENV"
      # As CI's live job does: without OPENFGA_STORE_ID the core refuses every real staff token. fga:seed writes the ids
      # to .env; they go to the job env so the core run.sh starts sees them.
      - name: OpenFGA store and model for the core (fga:seed)
        run: |
          if ! pnpm --filter @platform/auth-sdk fga:seed > "$RUNNER_TEMP/fga-seed.log" 2>&1; then
            cat "$RUNNER_TEMP/fga-seed.log"; exit 1
          fi
          store="$(sed -n 's/^OPENFGA_STORE_ID=//p' .env)"
          model="$(sed -n 's/^OPENFGA_MODEL_ID=//p' .env)"
          if [ -z "$store" ] || [ -z "$model" ]; then echo 'fga:seed wrote no OPENFGA_STORE_ID / OPENFGA_MODEL_ID'; exit 1; fi
          { echo "OPENFGA_STORE_ID=$store"; echo "OPENFGA_MODEL_ID=$model"; } >> "$GITHUB_ENV"
      # The staff realm's DEV user, read from the committed realm file at run time (the same credential CI's live job
      # uses): nothing in this workflow repeats it. Masked anyway, so it never appears in a log.
      - name: the analyst's dev password, from infra/keycloak/staff-realm.json (masked)
        run: |
          pw="$(node -p 'require("./infra/keycloak/staff-realm.json").users.find((u) => u.username === process.env.METRICS_STAFF_USER).credentials.find((c) => c.type === "password").value')"
          echo "::add-mask::$pw"
          echo "METRICS_STAFF_PASSWORD=$pw" >> "$GITHUB_ENV"
      # Step timeouts inside the job's 75: a step that times out FAILS (the gate still renders broken and the schedule
      # still comments), whereas the job's own timeout cancels the run, and a cancelled run says nothing (#813 review).
      - name: pass 1 (the target run, and the ramps when asked for) and report
        timeout-minutes: 35
        env:
          LOAD_SKIP_POOL: ${{ (github.event_name == 'schedule' || inputs.skip_ramps) && '1' || '' }}
          LOAD_SKIP_CEILING: ${{ (github.event_name == 'schedule' || inputs.skip_ramps) && '1' || '' }}
        run: bash infra/load/run.sh "$RUNNER_TEMP/load/pass1"
      # The retry-once rule: runner noise is real, so a crossed gate counts only when a second, fresh pass (its own
      # core and database) crosses one too. render prints "the retry fired" whenever pass 2 was needed.
      - name: pass 2, only when pass 1 crossed an SLO gate
        id: pass2
        timeout-minutes: 20
        run: |
          set +e
          node infra/load/slo-gate.mjs verdict "$RUNNER_TEMP/load/pass1"
          rc=$?
          set -e
          # A broken pass 1 is not retried, and NOT failed here: the gate renders it as "infrastructure, not a
          # regression" (with the reason), the last step fails the run, and a scheduled run still posts its comment.
          if [ "$rc" -eq 2 ]; then echo "pass 1 could not be judged: no pass 2; the verdict below says why"; exit 0; fi
          if [ "$rc" -eq 1 ]; then
            LOAD_SKIP_POOL=1 LOAD_SKIP_CEILING=1 bash infra/load/run.sh "$RUNNER_TEMP/load/pass2"
          fi
      # Also after a failed step (the stack, ClickHouse, the seed, fga:seed, a pass that failed or timed out): the gate
      # then renders `broken` with the reason ("this pass never ran", "pass 2 never ran", k6's exit), so a scheduled
      # run still posts its weekly comment instead of an empty verdict and silence (#801 review). Not on a cancel (or
      # the job's own timeout, which GitHub treats as one): a cancelled run says nothing.
      - name: the SLO verdict
        id: gate
        if: ${{ !cancelled() }}
        run: |
          node infra/load/slo-gate.mjs render "$RUNNER_TEMP/load/slo" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$RUNNER_TEMP/load/pass1" "$RUNNER_TEMP/load/pass2"
          echo "verdict=$(cat "$RUNNER_TEMP/load/slo/verdict.txt")" >> "$GITHUB_OUTPUT"
      - name: report to the job summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
        run: |
          if [ -f "$RUNNER_TEMP/load/slo/tracking.md" ]; then cat "$RUNNER_TEMP/load/slo/tracking.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$EVENT_NAME" != schedule ] && [ "$VERDICT" = breach ]; then
            {
              echo
              echo "#### DRY RUN: the regression issue a scheduled run would open or update"
              echo "**Title:** load regression (scheduled k6)"
              echo
              cat "$RUNNER_TEMP/load/slo/issue.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          for pass in pass1 pass2; do
            if [ -f "$RUNNER_TEMP/load/$pass/report.md" ]; then
              { echo; echo "<details><summary>full report, $pass</summary>"; echo; cat "$RUNNER_TEMP/load/$pass/report.md"; echo; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-report
          path: ${{ runner.temp }}/load
          retention-days: 90
          if-no-files-found: warn
      - name: stop the stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml --profile analytics down -v
      # Both fail the run. A breach is a regression (the schedule opens the regression issue). broken is
      # infrastructure: a pass could not be judged (k6 crashed, an SLO route saw no requests), so no regression issue.
      - name: a confirmed breach, or a pass that could not be judged, fails the run
        if: steps.gate.outputs.verdict == 'breach' || steps.gate.outputs.verdict == 'broken'
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}
        run: |
          if [ "$VERDICT" = breach ]; then
            echo "both passes crossed an SLO gate: see the job summary"
          else
            echo "infrastructure, not a regression: a pass could not be judged (see the job summary); no regression issue"
          fi
          exit 1

  # Only the SCHEDULE writes issues, and only this job holds `issues: write`. A manual run printed the same texts above.
  issues:
    name: tracking comment and regression issue
    needs: load
    if: github.event_name == 'schedule' && always() && needs.load.result != 'cancelled' && needs.load.outputs.verdict != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: load-report
          path: load
      - name: one comment per scheduled run on the tracking issue
        run: |
          title='load: weekly SLO regression tracking (scheduled k6)'
          n="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\"))[0].number")"
          if [ -z "$n" ]; then
            n="$(gh issue create --title "$title" --body 'One comment per scheduled k6 SLO regression run (.github/workflows/load.yml, Mondays 04:00 UTC). Read the trend here before a breach.' | sed 's#.*/##')"
          fi
          gh issue comment "$n" --body-file load/slo/tracking.md
      - name: a confirmed breach opens or updates the regression issue
        if: needs.load.outputs.verdict == 'breach'
        run: |
          title='load regression (scheduled k6)'
          n="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\"))[0].number")"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file load/slo/issue.md
          else
            gh label create load-regression --color B60205 \
              --description 'A confirmed breach of the scheduled k6 SLO regression' 2>/dev/null || true
            gh issue create --title "$title" --label load-regression --body-file load/slo/issue.md
          fi
