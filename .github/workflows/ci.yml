name: ci

on:
  pull_request:
  push:
    branches: [main]
    # A memory-only push to main would otherwise run the whole pipeline with CHANGES_ALL=1 — the
    # most expensive run there is — to test nothing.
    #
    # Deliberately NOT on `pull_request`. Branch protection requires five checks, and a workflow
    # that does not run reports nothing, so a docs-only PR would sit "Expected — waiting for status"
    # and could never merge. On the PR side the classifier already makes a docs-only run no-op in
    # seconds, so there is little to save and a merge deadlock to lose.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default for every job. Nothing in this workflow writes to the repository or to the
# API — deploy-staging.yml is the one that commits, and it raises its own permissions.
permissions:
  contents: read

env:
  NODE_VERSION: 20
  DATABASE_URL: postgres://platform:platform@localhost:5432/platform
  DATABASE_URL_APP: postgres://platform_app:platform_app@localhost:5432/platform

jobs:
  # scripts/check-ownership.sh is owned by the main window and stays the first job.
  ownership:
    name: ownership check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: self-test
        run: bash scripts/check-ownership.test.sh
      - name: check branch writes only its owned paths
        run: bash scripts/check-ownership.sh

  # One place that answers "what did this PR touch", replacing the per-job `git diff` filters that
  # tasks 2.1 and 2.2 each added inline.
  #
  # The jobs below always RUN and skip their expensive steps, rather than being skipped wholesale
  # with a job-level `if`. A skipped job reports a different conclusion to branch protection than a
  # successful one, and required checks are far easier to reason about when every job always reports
  # success. The cost is a few seconds of runner startup per job; the saving is the pnpm install,
  # the test run and the image build.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      images: ${{ steps.filter.outputs.images }}
      terraform: ${{ steps.filter.outputs.terraform }}
      e2e: ${{ steps.filter.outputs.e2e }}
      helm: ${{ steps.filter.outputs.helm }}
      observ: ${{ steps.filter.outputs.observ }}
      perf: ${{ steps.filter.outputs.perf }}
      perf_apps: ${{ steps.filter.outputs.perf_apps }}
      perf_unmeasured: ${{ steps.filter.outputs.perf_unmeasured }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The classifier lives in infra/ci/changes.sh with its own self-test, so the rules are
      # testable instead of buried in YAML. Same arrangement as scripts/check-ownership.sh.
      - name: self-test the classifier
        run: bash infra/ci/changes.test.sh
      # Node's built-in runner, no install: the live-suite guard used by `auth-e2e`.
      - name: self-test the live-suite guard
        run: node --test infra/ci/require-live-tests.test.mjs
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            CHANGES_ALL=1 bash infra/ci/changes.sh
          else
            bash infra/ci/changes.sh '${{ github.event.pull_request.base.sha }}'
          fi

  lint-typecheck:
    name: lint + typecheck
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # setup-node already caches the pnpm store. This caches turbo's task output, so an unchanged
      # package skips its build/typecheck entirely instead of redoing it.
      - uses: actions/cache@v4
        if: needs.changes.outputs.code == 'true'
        with:
          path: .turbo
          key: turbo-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-lint-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code == 'true'
      - run: pnpm lint
        if: needs.changes.outputs.code == 'true'
      - run: pnpm format:check
        if: needs.changes.outputs.code == 'true'
      - run: pnpm typecheck
        if: needs.changes.outputs.code == 'true'
      - name: generated files are current (events + contracts)
        if: needs.changes.outputs.code == 'true'
        run: git diff --exit-code -- packages/events/src/generated packages/contracts/src/generated

  unit:
    name: unit tests (with Postgres, RLS)
    runs-on: ubuntu-latest
    needs: [changes]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@v4
        if: needs.changes.outputs.code == 'true'
        with:
          path: .turbo
          key: turbo-unit-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-unit-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code == 'true'
      - run: pnpm test
        if: needs.changes.outputs.code == 'true'
      - name: migrate + seed against a fresh database (smoke)
        if: needs.changes.outputs.code == 'true'
        run: pnpm db:migrate && pnpm db:seed

  contract:
    name: contract tests (Prism)
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@v4
        if: needs.changes.outputs.code == 'true'
        with:
          path: .turbo
          key: turbo-contract-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-contract-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code == 'true'
      - run: pnpm test:contract
        if: needs.changes.outputs.code == 'true'

  # The storefront performance gate (#257, #283): for each storefront in `perf_apps`, a production
  # build against the Prism mock, that storefront's own bundle budget (bundle-budget.json), then
  # Lighthouse CI against its own lighthouserc.json — three runs per URL. LHCI's assertions are NOT a
  # median: by default each takes the best of the three runs (`optimistic`); an assertion that sets
  # `aggregationMethod: pessimistic` (both storefronts' SEO) takes the worst. scripts/perf.mjs runs both
  # gates and exits non-zero if either is over budget — a gate, not a report, so nothing here is
  # continue-on-error.
  #
  # Coverage, honestly: Lighthouse audits only the URLs in each lighthouserc.json — today the PLP and a
  # PDP. The starter's home page has no Lighthouse and no axe check in CI (brand A's e2e has an axe spec;
  # the starter's does not). Widening that is the storefront owners' file, not this job.
  #
  # One matrix entry per storefront rather than one hardcoded app: a brand ships its own theme, fonts
  # and budgets, and measuring the starter in its place reported a vacuous pass on #280 (#283). Each
  # entry is its own runner, so every storefront can keep auditing on :3100.
  perf-app:
    name: storefront performance budget — ${{ matrix.app }}
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.perf_apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: which package
        id: app
        env:
          APP: ${{ matrix.app }}
        run: |
          echo "package=$(node -p "require('./$APP/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "id=$(basename "$APP")" >> "$GITHUB_OUTPUT"
      # next.config.mjs imports @platform/cms and the app imports @platform/ui, so their dist/ must
      # exist before `next build`; `^...` builds the storefront's dependencies, not the storefront.
      - name: build the storefront's workspace dependencies
        run: pnpm turbo run build --filter='${{ steps.app.outputs.package }}^...'
      # The same command the Playwright config uses to start Prism. 127.0.0.1, never localhost.
      - name: start the Store API mock (Prism)
        run: |
          pnpm --filter @platform/contracts mock > "$RUNNER_TEMP/prism.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:4010/store && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/prism.log"
          exit 1
      - name: performance budget — fails if any budget is exceeded
        env:
          MOCK_API_URL: http://127.0.0.1:4010
          # robots.ts fails closed (Disallow: /) without it, which fails Lighthouse's is-crawlable
          # audit and caps SEO at 0.69. perf.mjs also sets it now; this stays as a belt.
          ROBOTS_ALLOW_INDEXING: '1'
        run: pnpm --filter '${{ steps.app.outputs.package }}' perf
      - name: Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ steps.app.outputs.id }}
          path: ${{ matrix.app }}/.lighthouseci
          # upload-artifact@v4 skips dot-directories by default; without this the reports are dropped.
          include-hidden-files: true
          if-no-files-found: ignore

  # The required check. Its name is the one branch protection enforces, so it must keep this name and
  # must always report: a matrix job's checks are named per entry, and a skipped job reports a
  # conclusion protection treats differently from success. Green only when the classifier ran and
  # every storefront it listed passed; green-and-says-so when no storefront changed. RED when a brand
  # storefront changed that has no `perf` script: that used to be the same green "no storefront
  # changed", a vacuous pass for exactly the PR that most needed measuring (#336 review).
  perf:
    name: storefront performance budget (bundle + Lighthouse)
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, perf-app]
    steps:
      - name: every changed storefront is within budget
        env:
          CHANGES: ${{ needs.changes.result }}
          PERF: ${{ needs.changes.outputs.perf }}
          APPS: ${{ needs.changes.outputs.perf_apps }}
          UNMEASURED: ${{ needs.changes.outputs.perf_unmeasured }}
          RESULT: ${{ needs.perf-app.result }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "the change classifier did not succeed ($CHANGES) — refusing to report a pass"
            exit 1
          fi
          if [ "$UNMEASURED" != '[]' ]; then
            echo "::error::storefront changed with no perf script, so it cannot be measured: $UNMEASURED"
            echo "Add scripts/perf.mjs, bundle-budget.json and lighthouserc.json (and a \"perf\" script) as brand A has."
            exit 1
          fi
          if [ "$PERF" != true ]; then
            echo "no storefront changed — nothing to measure"
            exit 0
          fi
          echo "measured: $APPS"
          if [ "$RESULT" != success ]; then
            echo "storefront performance budget: $RESULT — see the per-storefront jobs above"
            exit 1
          fi

  images:
    name: app images (build only, no push)
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.images == 'true'
      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs.images == 'true'
      # bake, not `docker compose build`: the GitHub Actions cache backend needs
      # ACTIONS_RUNTIME_TOKEN and ACTIONS_CACHE_URL, which are available to an action but not to a
      # plain `run:` step. docker-compose.build.yml still defines every image; docker-bake.hcl only
      # adds the cache wiring. See the comments in that file.
      # workdir matters: bake resolves a target's `context` relative to the working directory, not to
      # the file that declares it, so `context: ../..` only means the repo root when bake runs from
      # infra/docker. (`docker compose build` resolves it relative to the compose file, which is why
      # the local command needs no equivalent.) `bake --print` does not resolve contexts at all, so
      # it cannot catch this — only a real build can.
      - name: build every app image (cached, no push)
        if: needs.changes.outputs.images == 'true'
        uses: docker/bake-action@v5
        env:
          IMAGE_TAG: ${{ github.sha }}
          # Pull requests read the build cache; only pushes to main write it. Exporting cost more
          # than the build saved — see the CACHE_TO comment in infra/docker/docker-bake.hcl.
          CACHE_TO: ${{ github.event_name == 'push' && '1' || '' }}
        with:
          workdir: infra/docker
          files: |
            docker-compose.build.yml
            docker-bake.hcl
          load: true
          push: false
      # The COPY list in each Dockerfile's `deps` stage is what makes the install layer cacheable;
      # this fails the build if a workspace package was added or removed without updating it.
      - name: the image manifest lists are complete
        if: needs.changes.outputs.images == 'true'
        run: bash infra/ci/check-image-manifests.sh
      - name: smoke — non-root, build output present, scaffolds healthy
        if: needs.changes.outputs.images == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: bash infra/docker/smoke-images.sh

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.terraform == 'true'
      - uses: hashicorp/setup-terraform@v3
        if: needs.changes.outputs.terraform == 'true'
        with:
          terraform_version: 1.13.0
          terraform_wrapper: false
      # fmt -check, then init -backend=false + validate for dev and staging.
      # No AWS account, no credentials and no state are involved; `terraform plan` stays a manual
      # step in the runbook until the owner provides an account.
      - name: fmt + validate (dev and staging)
        if: needs.changes.outputs.terraform == 'true'
        run: bash infra/terraform/check.sh

  # Issue #80. One job for everything that needs a real Keycloak, a real OpenFGA and a browser:
  # the live auth suites (packages/auth-sdk, apps/core hq-rbac) and the Playwright journeys.
  #
  # It uses `docker compose` rather than GitHub `services:` because the realms have to be imported
  # from infra/keycloak, and a services container cannot mount a repository directory.
  #
  # The live suites gate themselves on reachability (`describe.runIf(live)`), which on a runner means
  # a mis-wired service produces a green job that asserts nothing. wait-for-auth-stack.sh fails the
  # job first if anything is missing, and run-e2e.sh fails if it finds no journeys at all.
  auth-e2e:
    name: live auth + end-to-end (Keycloak, OpenFGA, Playwright)
    runs-on: ubuntu-latest
    needs: [changes]
    env:
      KEYCLOAK_URL: http://localhost:8180
      OPENFGA_API_URL: http://localhost:8081
      # The compose stack puts Postgres on 5433, unlike the `unit` job's service container on 5432.
      DATABASE_URL: postgres://platform:platform@localhost:5433/platform
      DATABASE_URL_APP: postgres://platform_app:platform_app@localhost:5433/platform
      MOCK_API_URL: http://localhost:4010
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.e2e == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.e2e == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.e2e == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.e2e == 'true'
      - name: boot keycloak (staff + customers realms), openfga and postgres
        if: needs.changes.outputs.e2e == 'true'
        run: docker compose -f infra/docker/docker-compose.yml up -d postgres redis keycloak openfga
      - name: the auth stack is really up (the live suites skip silently otherwise)
        if: needs.changes.outputs.e2e == 'true'
        run: bash infra/ci/wait-for-auth-stack.sh
      # The core's own live suites (#297): until now they ran in no CI job — the `unit` job has no
      # Keycloak, so `describe.runIf(live)` skipped them there, quietly. Here the stack is up, and the
      # report is checked so a probe that misses fails the step instead of skipping the block. Each
      # suite creates its own throwaway database (createTestDatabase), so nothing shared is seeded.
      #
      # BEFORE the auth-sdk live suites, deliberately. Both sign `owner` in with the dev TOTP, and
      # Keycloak refuses a code that was already used. auth-sdk's keycloak-realms test spends the
      # current window's code and the next one's; the core's helper tries the previous window, then
      # the current, then waits for the next — so after auth-sdk every code it can try is spent and
      # the owner grant fails `invalid_grant` (first run of #344). Run first, the core spends only the
      # previous window's code, which auth-sdk never uses.
      - name: core live suites (real Keycloak tokens, OpenFGA) — and they really ran
        if: needs.changes.outputs.e2e == 'true'
        run: |
          pnpm exec turbo run build --filter='@platform/core^...'
          pnpm --filter @platform/core exec vitest run test/auth-live.test.ts test/customers-api.test.ts             --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/core-live.json"
          node infra/ci/require-live-tests.mjs "$RUNNER_TEMP/core-live.json"             'Integration 1: real Keycloak tokens + OpenFGA through mountCoreMiddleware'             'live: real customers-realm tokens through the real verifier'
      # One command covers both suites: packages/auth-sdk/vitest.config.ts already collects
      # ../../apps/core/src/modules/hq-rbac/test/**, which is how window 2 wired them.
      # Through turbo, not `pnpm --filter ... test`, so `dependsOn: ^build` builds @platform/db and
      # @platform/contracts first — the same reason the Dockerfiles use `--filter <app>...`.
      - name: live auth suites (packages/auth-sdk + apps/core hq-rbac)
        if: needs.changes.outputs.e2e == 'true'
        run: pnpm exec turbo run test --filter=@platform/auth-sdk
      # run-e2e.sh installs the browser itself, from the package that declares @playwright/test —
      # `pnpm exec playwright` at the workspace root cannot find it.
      # Boot the real server. Everything else in this pipeline reasons about the code without
      # running it: `medusa build` proves it compiles, the unit tests prove the modules behave, the
      # image smoke test proves a container starts and answers a health endpoint served by the
      # scaffold fallback. None of them load Medusa's own runtime — its config, its plugin and module
      # loaders, its database and Redis connections. A failure there is a production outage that CI
      # otherwise reports as green. It found one on its first run (REQUEST #207).
      #
      # Kept running afterwards (CORE_SMOKE_KEEP=1, #295): the brand storefront journeys run against
      # this core — browse -> buy places a real order on its own fresh database — and the stop step
      # below drops it. The starter's journeys stay on Prism.
      - name: core boots for real (Medusa loaders, database, Redis) and stays up for the brand journeys
        if: needs.changes.outputs.e2e == 'true'
        env:
          CORE_SMOKE_KEEP: '1'
        run: bash infra/ci/boot-smoke.sh
      # apps/* against Prism; apps/storefronts/* against the kept core (on by default since #295; a
      # brand that cannot reach the core fails here rather than quietly testing the mock). The job's
      # `e2e` group already skips docs-only PRs, so the brand journeys run exactly when code, CI
      # config, the realms or the compose stack change.
      - name: playwright journeys (apps/* on Prism, brand storefronts on the core)
        if: needs.changes.outputs.e2e == 'true'
        run: bash infra/ci/run-e2e.sh
      - name: keycloak and openfga logs on failure
        if: failure() && needs.changes.outputs.e2e == 'true'
        run: docker compose -f infra/docker/docker-compose.yml logs --tail=100 keycloak openfga
      - uses: actions/upload-artifact@v4
        if: failure() && needs.changes.outputs.e2e == 'true'
        with:
          name: playwright-report
          path: |
            apps/*/playwright-report
            apps/storefronts/*/playwright-report
          retention-days: 7
          if-no-files-found: ignore
      # Before the stack goes: dropping the kept core's database needs Postgres. Always exits 0, so it
      # can neither hide a failed journey nor fail a green job.
      - name: stop the kept core and drop its database
        if: always() && needs.changes.outputs.e2e == 'true'
        run: bash infra/ci/boot-smoke.sh --stop
      - name: stop the stack
        if: always() && needs.changes.outputs.e2e == 'true'
        run: docker compose -f infra/docker/docker-compose.yml down -v

  helm:
    name: helm lint + template + kubeconform
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.helm == 'true'
      - uses: azure/setup-helm@v4
        if: needs.changes.outputs.helm == 'true'
        with:
          version: v3.16.3
      - name: kubeconform
        if: needs.changes.outputs.helm == 'true'
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz |
            sudo tar -xz -C /usr/local/bin kubeconform
      # helm lint, then `helm template` for all ten app/environment combinations, then kubeconform
      # -strict over everything rendered plus infra/argocd. No cluster and no credentials: this
      # answers "would Kubernetes accept these objects", not "did the deploy work".
      - name: render and validate every chart and environment
        if: needs.changes.outputs.helm == 'true'
        run: bash infra/helm/check.sh
      # Every values rule (storefront SITE_URL/robots, the production file name, seeded dev keys) is
      # shown to fail on a fixture built to break it — check.sh only shows today's files pass.
      - name: values rules self-test
        if: needs.changes.outputs.helm == 'true'
        run: bash infra/helm/check-values.test.sh
      # The deployed customers realm is generated from infra/keycloak/customers-realm.json (#297);
      # the self-test proves it carries no test client, user, localhost URI, unverified email or
      # auto-linking broker login, and that each of those rules fails when its violation is put back.
      - name: derived customers realm is deployable (and every rule can fail)
        if: needs.changes.outputs.helm == 'true'
        run: node --test infra/deploy/keycloak/derive-customers-realm.test.mjs

  observability:
    name: observability config
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.observ == 'true'
      # Static only: the profile is off by default, the dashboards are valid JSON naming datasources
      # that exist, no two services claim a host port, and Prometheus parses its config. Whether the
      # pipeline actually carries a span is the smoke test in the runbook, which needs the stack up.
      - name: validate the observability stack
        if: needs.changes.outputs.observ == 'true'
        run: bash infra/observability/check.sh

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the diff: a credential committed and then "removed" in
          # a later commit is still in the repository and still in every clone.
          fetch-depth: 0
      # The CLI in a container rather than gitleaks/gitleaks-action, for two reasons. The action
      # needs `pull-requests: write` to post its findings as a comment and fails the job with
      # "Resource not accessible by integration" without it — and a comment quoting a finding is
      # the last place a leaked credential should be republished. The job failing is signal enough;
      # the log is redacted.
      #
      # Unconditional, on every change, no path filter. A path filter on a secret scan only means
      # the one PR that adds a key to an unwatched directory is the one that is not scanned.
      - name: scan the repository and its history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git . --config infra/gitleaks.toml --redact --no-banner --exit-code 1

  preview:
    name: preview deploy (placeholder)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit, contract, ownership]
    steps:
      - name: placeholder
        run: |
          echo "Preview deploy is wired by window 5 (infra) in Phase 2: Vercel preview per storefront/admin app, core on a staging namespace."
