# Weekly grouped dependency updates (#730, plan D4). The audit gate (`dependency audit (production)`) says what is
# vulnerable; this keeps the baseline in infra/security/audit-allowlist.json shrinking. Minor and patch bumps arrive as
# ONE PR per group per week; a major bump arrives as its own PR, because it needs its owning window's review.
version: 2
updates:
  # The pnpm workspace: one lockfile at the root covers every app and package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # Out of BOTH groups (each comes as its own PR), because a grouped bump of any of them turned the whole group
      # red (#747, #755, 2026-11-09):
      # - The storefront brands' package.json is generated by `scripts/sync-from-starter.mjs` and pinned to the
      #   committed scripts/starter-manifest.json (brand-a's test/sync-merge.test.ts: "re-merging from the manifest
      #   writes the same bytes"). Dependabot edits the brands' file but not the manifest. The bump has to land in the
      #   starter and be re-synced into each brand, which updates both, so these names are the starter manifest's.
      # - @medusajs/* is a platform upgrade with its own migration work (see the ignore below).
      production:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns:
          - '@medusajs/*'
          - '@playwright/test'
          - '@stripe/react-stripe-js'
          - '@stripe/stripe-js'
          - '@types/node'
          - '@types/react'
          - '@types/react-dom'
          - 'ajv'
          - 'ajv-formats'
          - 'autoprefixer'
          - 'jsdom'
          - 'next'
          - 'next-intl'
          - 'postcss'
          - 'react'
          - 'react-dom'
          - 'tailwindcss'
          - 'typescript'
          - 'vitest'
          - 'yaml'
      development:
        dependency-type: development
        update-types: [minor, patch]
        # the same list as production's (kept in step by hand: Dependabot's YAML has no anchors)
        exclude-patterns:
          - '@medusajs/*'
          - '@playwright/test'
          - '@stripe/react-stripe-js'
          - '@stripe/stripe-js'
          - '@types/node'
          - '@types/react'
          - '@types/react-dom'
          - 'ajv'
          - 'ajv-formats'
          - 'autoprefixer'
          - 'jsdom'
          - 'next'
          - 'next-intl'
          - 'postcss'
          - 'react'
          - 'react-dom'
          - 'tailwindcss'
          - 'typescript'
          - 'vitest'
          - 'yaml'
    # Majors that no PR can take on its own. Minor and patch bumps of these still arrive in the weekly groups.
    ignore:
      # The types must describe the Node we run: 20 everywhere (engines ">=20.11", the Dockerfiles' NODE_VERSION
      # 20.19-alpine, CI's NODE_VERSION 20). @types/node 22 would type APIs Node 20 does not have. Remove this
      # when the runtime moves, in the same PR as those three.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Medusa majors are platform migrations (apps/core), chosen and planned, not a weekly bump.
      - dependency-name: '@medusajs/*'
        update-types: ['version-update:semver-major']
      # Medusa 2.22 needs Node 22, and we run Node 20 (#755, 2026-11-09). @medusajs/cli 2.22.3 depends on execa
      # 10.2.1, which declares `node >=22`: `medusa build` failed with "TEXT_ENCODINGS.union is not a function"
      # (Set.prototype.union is Node 22), and `medusa db:migrate` with 'No "exports" main' in unicorn-magic
      # (execa's npm-run-path 6). 2.22 also changed the migrate options type (TS2345 in
      # apps/core/scripts/db-medusa-migrate.ts). Lift this together with the Node 22 move.
      - dependency-name: '@medusajs/*'
        versions: ['>=2.22.0']
      # Medusa itself depends on @opentelemetry/api 1.x and the SDK 2.x line (@medusajs/deps, workflows-sdk), in the
      # same process as the core's own telemetry (#729). The API is a process-wide singleton: a second major is
      # refused at registration, and the core's spans and metrics would silently go to a no-op. Move with Medusa.
      - dependency-name: '@opentelemetry/*'
        update-types: ['version-update:semver-major']
      # The core's routes run on Medusa's express app (express 4 inside @medusajs/framework); a different major in
      # apps/core, or its types, would not be the server the routes are mounted on. Move with Medusa.
      - dependency-name: 'express'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/express'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
    ignore:
      # docker/bake-action 6+ builds from the Git context by default, not the checkout, so `workdir: infra/docker`
      # no longer applies and the relative `files:` resolve at the repo root. #743 (2026-11-09) failed "app images"
      # with "lstat docker-compose.build.yml: no such file or directory". Lift this in the PR that moves ci.yml and
      # deploy-staging.yml to v7 with `source: .` (the local checkout).
      - dependency-name: 'docker/bake-action'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directories:
      - /apps/accounting
      - /apps/admin
      - /apps/analytics-ingest
      - /apps/core
      - /apps/feeds
      - /apps/notifications
      - /apps/storefront-starter
      - /apps/storefronts/brand-a
      - /apps/storefronts/brand-b
      - /apps/storefronts/brand-c
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    commit-message:
      prefix: docker
    groups:
      base-images:
        patterns: ['*']
    ignore:
      # The Node major moves once, everywhere (engines, CI's NODE_VERSION, @types/node above), never as a base-image
      # bump of one Dockerfile.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
