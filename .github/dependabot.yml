# Weekly grouped dependency updates (#730, plan D4). The audit gate (`dependency audit (production)`) says what is
# vulnerable; this keeps the baseline in infra/security/audit-allowlist.json shrinking. Minor and patch bumps arrive as
# ONE PR per group per week; a major bump arrives as its own PR, because it needs its owning window's review.
version: 2
updates:
  # The pnpm workspace: one lockfile at the root covers every app and package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # @medusajs/* moves as ONE PR of its own (cli, framework, medusa and draft-order must match), never inside the
      # production or development group: a Medusa bump is a platform upgrade with its own migration work (#755).
      medusa:
        patterns: ['@medusajs/*']
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns: ['@medusajs/*']
      development:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ['@medusajs/*']
    ignore:
      # ==== UNTIL THE NODE 22 MOVE ====
      # We run Node 20 everywhere: engines ">=20.11", the Dockerfiles' NODE_VERSION 20.19-alpine, CI's NODE_VERSION 20.
      # Every entry in this block needs Node 22. It is that move's checklist: lift them in the PR that moves the
      # runtime (engines, Dockerfiles, CI and @types/node together).
      #
      # @types/node: the types must describe the Node we run; 22's would type APIs Node 20 does not have. (Today
      # @types/node is also a starter package, ignored in full further down; this rule is what stays when that one is
      # lifted.)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Medusa 2.22+ (#755, 2026-11-09): @medusajs/cli 2.22.3 depends on execa 10.2.1, which declares `node >=22`.
      # `medusa build` failed with "TEXT_ENCODINGS.union is not a function" (Set.prototype.union is Node 22), and
      # `medusa db:migrate` with 'No "exports" main' in unicorn-magic (execa's npm-run-path 6). The TS2345 in
      # apps/core/scripts/db-medusa-migrate.ts that #755 also showed arrived with 2.21, NOT 2.22: 2.21 is allowed, and
      # window 1 adapts the script with the 2.21.2 bump.
      - dependency-name: '@medusajs/*'
        versions: ['>=2.22.0']
      # The OTLP exporters 0.300+ are the OpenTelemetry SDK 3 line: they need Node >= 22.15 and pull a second SDK line
      # next to our 2.12 (#775, 2026-11-10). Under 0.x semver this is a "minor" bump, so the @opentelemetry/* major
      # ignore below does not catch it.
      - dependency-name: '@opentelemetry/exporter-metrics-otlp-http'
        versions: ['>=0.300.0']
      - dependency-name: '@opentelemetry/exporter-trace-otlp-http'
        versions: ['>=0.300.0']
      # @axe-core/playwright 4.14 declares node >= 22.12 (#778, 2026-11-10).
      - dependency-name: '@axe-core/playwright'
        versions: ['>=4.14.0']
      # @testing-library/jest-dom 7 needs Node >= 22 (#780, closed 2026-11-10).
      - dependency-name: '@testing-library/jest-dom'
        update-types: ['version-update:semver-major']
      # Sanity 6 (sanity, @sanity/vision; cms/ is on 4) needs Node >= 22.12 (#796, #799, closed 2026-11-11). Majors only:
      # Sanity's minor and patch bumps still arrive in the groups.
      - dependency-name: 'sanity'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sanity/vision'
        update-types: ['version-update:semver-major']
      # ==== end of the Node 22 checklist ====
      #
      # Majors that no PR can take on its own. Minor and patch bumps of these still arrive in the weekly groups.
      # Medusa majors are platform migrations (apps/core), chosen and planned, not a weekly bump.
      - dependency-name: '@medusajs/*'
        update-types: ['version-update:semver-major']
      # Medusa itself depends on @opentelemetry/api 1.x and the SDK 2.x line (@medusajs/deps, workflows-sdk), in the
      # same process as the core's own telemetry (#729). The API is a process-wide singleton: a second major is
      # refused at registration, and the core's spans and metrics would silently go to a no-op. Move with Medusa.
      - dependency-name: '@opentelemetry/*'
        update-types: ['version-update:semver-major']
      # The core's routes run on Medusa's express app (express 4 inside @medusajs/framework); a different major in
      # apps/core, or its types, would not be the server the routes are mounted on. Move with Medusa.
      - dependency-name: 'express'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/express'
        update-types: ['version-update:semver-major']
      # The storefront starter's packages: ignored here in EVERY update type (#747, #755, #757, 2026-11-09).
      # The brands' package.json is generated by `scripts/sync-from-starter.mjs` and pinned to the committed
      # scripts/starter-manifest.json (brand-a's test/sync-merge.test.ts: "re-merging from the manifest writes
      # the same bytes"). Dependabot edits the brands' package.json but never the manifest, so any PR of its for
      # these is red by construction, and single red PRs would fill open-pull-requests-limit and starve the
      # groups. They move through the starter → sync-from-starter → brands path instead (REQUEST #758, window 10). A new advisory on any of them is still caught: the production audit gate
      # (`dependency audit (production)`) does not read this file.
      - dependency-name: '@playwright/test'
      - dependency-name: '@stripe/react-stripe-js'
      - dependency-name: '@stripe/stripe-js'
      - dependency-name: '@types/node'
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-dom'
      - dependency-name: 'ajv'
      - dependency-name: 'ajv-formats'
      - dependency-name: 'autoprefixer'
      - dependency-name: 'jsdom'
      - dependency-name: 'next'
      - dependency-name: 'next-intl'
      - dependency-name: 'postcss'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'tailwindcss'
      - dependency-name: 'typescript'
      - dependency-name: 'vitest'
      - dependency-name: 'yaml'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /apps/accounting
      - /apps/admin
      - /apps/analytics-ingest
      - /apps/core
      - /apps/feeds
      - /apps/notifications
      - /apps/storefront-starter
      - /apps/storefronts/brand-a
      - /apps/storefronts/brand-b
      - /apps/storefronts/brand-c
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    commit-message:
      prefix: docker
    groups:
      base-images:
        patterns: ['*']
    ignore:
      # The Node major moves once, everywhere (engines, CI's NODE_VERSION, @types/node above), never as a base-image
      # bump of one Dockerfile.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
